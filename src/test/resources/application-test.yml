spring:
  application:
    name: billit
  config:
    activate:
      on-profile: test
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
        read-enums-using-to-string: false
        write-enums-using-to-string: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://invalid:5432/invalid
    username: invalid
    password: invalid
    hikari:
      connection-timeout: 5000
  data:
    redis:
      host: invalid
      port: 6379
      username: ""
      password: ""
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: false
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    baseline-on-migrate: false
    clean-disabled: true

app:
  exchange-rate:
    frankfurter:
      source: ECB
  storage:
    enabled: false
    s3:
      endpoint: http://invalid:9090
      bucket: invalid
      region: us-east-1
      access-key: invalid
      secret-key: invalid
  api-docs:
    enabled: false
  event-executor:
    core-pool-size: ${EVENT_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${EVENT_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${EVENT_EXECUTOR_QUEUE_CAPACITY:100}
  auth:
    jwt:
      secret: YmlsbGl0LXRlc3Qtb25seS1qd3Qtc2lnbmluZy1rZXktZG8tbm90LXVzZS1vbi1hbnktc2VydmVyLTAwMDAwMA==
    refresh-token:
      retry-grace-period: 30s
    social:
      google:
        client-id: test-google-client-id
        jwk-set-uri: http://invalid/google/jwks
      kakao:
        native-app-key: test-kakao-native-app-key
        jwk-set-uri: http://invalid/kakao/jwks
      apple:
        client-id: test-apple-client-id
        team-id: test-apple-team-id
        key-id: test-apple-key-id
        private-key-base64: ""
        jwk-set-uri: http://invalid/apple/jwks
        token-uri: http://invalid/apple/token
        revoke-uri: http://invalid/apple/revoke
    token-encryption:
      key: YmlsbGl0LXRlc3Qtb25seS10b2tlbi1lbmMta2V5ISE=

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

server:
  port: 0
  shutdown: graceful
  forward-headers-strategy: native

management:
  server:
    port: 0
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
          additional-path: "server:/readyz"
        liveness:
          include: livenessState
          additional-path: "server:/healthz"

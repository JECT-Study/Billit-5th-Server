spring:
  application:
    name: billit
  config:
    activate:
      on-profile: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
        read-enums-using-to-string: false
        write-enums-using-to-string: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    baseline-on-migrate: false
    clean-disabled: true

app:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      issuer: billit
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
  exchange-rate:
    frankfurter:
      source: ${EXCHANGE_RATE_SOURCE:ECB}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9090}
      bucket: ${STORAGE_S3_BUCKET:billit-local}
      region: ${STORAGE_S3_REGION:us-east-1}
      access-key: ${STORAGE_S3_ACCESS_KEY:local}
      secret-key: ${STORAGE_S3_SECRET_KEY:local}
  api-docs:
    enabled: true
  event-executor:
    core-pool-size: ${EVENT_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${EVENT_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${EVENT_EXECUTOR_QUEUE_CAPACITY:100}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

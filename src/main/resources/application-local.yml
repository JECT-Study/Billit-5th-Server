spring:
  application:
    name: billit
  config:
    activate:
      on-profile: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
        read-enums-using-to-string: false
        write-enums-using-to-string: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    baseline-on-migrate: false
    clean-disabled: true

app:
  exchange-rate:
    frankfurter:
      source: ${EXCHANGE_RATE_SOURCE:ECB}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9090}
      bucket: ${STORAGE_S3_BUCKET:billit-local}
      region: ${STORAGE_S3_REGION:us-east-1}
      access-key: ${STORAGE_S3_ACCESS_KEY:local}
      secret-key: ${STORAGE_S3_SECRET_KEY:local}
  api-docs:
    enabled: true
  event-executor:
    core-pool-size: ${EVENT_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${EVENT_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${EVENT_EXECUTOR_QUEUE_CAPACITY:100}
  scheduling:
    enabled: true
  auth:
    jwt:
      secret: ${JWT_SECRET:YmlsbGl0LWxvY2FsLW9ubHktand0LXNpZ25pbmcta2V5LWRvLW5vdC11c2Utb24tZGV2LW9yLXByb2QtMDAwMA==}
    refresh-token:
      retry-grace-period: 30s
    login-history:
      cleanup-cron: "0 30 3 * * *"
    social:
      google:
        client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      kakao:
        native-app-key: ${KAKAO_NATIVE_APP_KEY:local-kakao-native-app-key}
        jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      apple:
        client-id: ${APPLE_CLIENT_ID:local-apple-client-id}
        team-id: ${APPLE_TEAM_ID:local-apple-team-id}
        key-id: ${APPLE_KEY_ID:local-apple-key-id}
        private-key-base64: "${APPLE_PRIVATE_KEY_BASE64:}"
        private-key-required: false
        jwk-set-uri: https://appleid.apple.com/auth/keys
        token-uri: https://appleid.apple.com/auth/token
        revoke-uri: https://appleid.apple.com/auth/revoke
        apple-endpoint-required: true
    token-encryption:
      key: ${AUTH_TOKEN_ENCRYPTION_KEY:YmlsbGl0LWxvY2FsLW9ubHktdG9rZW4tZW5jLWtleSE=}
  member:
    policy:
      content-base-url: ${POLICY_CONTENT_BASE_URL:http://localhost:8080/terms}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
          additional-path: "server:/readyz"
        liveness:
          include: livenessState
          additional-path: "server:/healthz"

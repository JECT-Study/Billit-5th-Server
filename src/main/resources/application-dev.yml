spring:
  application:
    name: billit
  config:
    activate:
      on-profile: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
        read-enums-using-to-string: false
        write-enums-using-to-string: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    baseline-on-migrate: false
    clean-disabled: true

app:
  exchange-rate:
    frankfurter:
      source: ${EXCHANGE_RATE_SOURCE:ECB}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:}
      bucket: ${STORAGE_S3_BUCKET:}
      region: ${STORAGE_S3_REGION:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
  api-docs:
    enabled: true
  event-executor:
    core-pool-size: ${EVENT_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${EVENT_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${EVENT_EXECUTOR_QUEUE_CAPACITY:100}

logging:
  structured:
    format:
      console: logstash

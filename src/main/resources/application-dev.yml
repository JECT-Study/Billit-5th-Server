spring:
  application:
    name: billit
  config:
    activate:
      on-profile: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
        read-enums-using-to-string: false
        write-enums-using-to-string: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    baseline-on-migrate: false
    clean-disabled: true

app:
  exchange-rate:
    frankfurter:
      source: ${EXCHANGE_RATE_SOURCE:ECB}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:}
      bucket: ${STORAGE_S3_BUCKET:}
      region: ${STORAGE_S3_REGION:}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
  api-docs:
    enabled: true
  event-executor:
    core-pool-size: ${EVENT_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${EVENT_EXECUTOR_MAX_POOL_SIZE:4}
    queue-capacity: ${EVENT_EXECUTOR_QUEUE_CAPACITY:100}
  auth:
    jwt:
      secret: ${JWT_SECRET}
    refresh-token:
      retry-grace-period: 30s
    social:
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      kakao:
        native-app-key: ${KAKAO_NATIVE_APP_KEY}
        jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      apple:
        client-id: ${APPLE_CLIENT_ID}
        team-id: ${APPLE_TEAM_ID}
        key-id: ${APPLE_KEY_ID}
        private-key-base64: ${APPLE_PRIVATE_KEY_BASE64}
        private-key-required: true
        jwk-set-uri: https://appleid.apple.com/auth/keys
        token-uri: https://appleid.apple.com/auth/token
        revoke-uri: https://appleid.apple.com/auth/revoke
        apple-endpoint-required: true
    token-encryption:
      key: ${AUTH_TOKEN_ENCRYPTION_KEY}

logging:
  structured:
    format:
      console: logstash

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
          additional-path: "server:/readyz"
        liveness:
          include: livenessState
          additional-path: "server:/healthz"

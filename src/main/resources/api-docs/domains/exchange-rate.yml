paths:
  "/api/v1/reference-exchange-rates":
    get:
      tags:
      - ExchangeRate
      operationId: getReferenceExchangeRate
      summary: 결제일 기준 환율 조회
      description: |
        지출 결제일의 참고 환율과 이를 고시한 기관, 실제 기준일을 조회합니다.

        ### 요청 권한
        가입을 마친 로그인 회원만 요청할 수 있습니다. 가입 전용 토큰으로는 요청할 수 없습니다.

        ### 처리 조건
        결제 통화 1단위당 원화 환율을 반환합니다. 결제일에 고시된 환율이 없으면 결제일 이전 7일 안에 고시된 가장 최근 환율을 반환하고, baseDate에 요청 날짜가 아닌 실제 고시 기준일을 담습니다.
        결제일과 그 이전 7일 안에 고시된 환율이 없으면 빈 값이나 임의 환율 대신 404로 응답합니다.
        KRW와 미래 날짜는 거절합니다. 미래 날짜는 서버 날짜(Asia/Seoul)를 기준으로 판단합니다.

        ### 사용 시 주의
        서버는 고시 기관(Frankfurter)에서 받은 환율을 일정 조건에서 저장해 같은 통화와 결제일의 다음 요청에는 외부를 호출하지 않습니다. 결제일이 서버 날짜보다 2일 미만 이전이고 결제일에 고시된 값이 아니면 저장하지 않고 응답에만 사용하므로, 같은 요청이 나중에 다른 값을 반환할 수 있습니다.
        외부 조회가 실패하면 환율이 없는 상태가 아니라 조회 불가로 응답하며, 자동으로 재시도하지 않습니다. 앱은 404와 503에서 사용자가 환율을 직접 입력하게 합니다.
      security:
      - bearerAuth: []
      parameters:
      - name: currency
        in: query
        required: true
        description: 환율을 조회할 결제 통화입니다. KRW는 거절합니다.
        schema:
          type: string
          enum:
          - JPY
          - USD
          - EUR
          - CNY
        example: JPY
      - name: paidDate
        in: query
        required: true
        description: 회원이 입력한 현지 결제 날짜입니다. 이 날짜를 환율 조회 기준으로 사용하며 UTC로 변환하지 않습니다. 미래 날짜는 거절합니다.
        schema:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        example: '2026-11-05'
      responses:
        '200':
          description: 결제일 기준 환율 조회 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./exchange-rate.yml#/components/schemas/ReferenceRate"
              examples:
                success:
                  summary: 결제일에 고시된 환율
                  value:
                    data:
                      currency: JPY
                      rate: '9.12'
                      provider: ECB
                      baseDate: '2026-11-05'
                previousPublished:
                  summary: 결제일이 휴일이라 이전 고시값을 사용
                  description: 요청한 paidDate가 2026-11-08(일)이면 baseDate는 직전 고시일입니다.
                  value:
                    data:
                      currency: JPY
                      rate: '9.12'
                      provider: ECB
                      baseDate: '2026-11-06'
        '400':
          description: |
            필수값이 없거나 currency, paidDate의 형식이나 값이 올바르지 않습니다. KRW와 서버 날짜보다 미래인 paidDate도 포함합니다.

            **오류 코드:** `COMMON_INVALID_REQUEST`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_INVALID_REQUEST:
                  summary: KRW 요청
                  value:
                    code: COMMON_INVALID_REQUEST
                    message: 요청이 올바르지 않습니다.
                    errors:
                    - field: currency
                      reason: 허용되지 않는 값입니다.
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '404':
          description: |
            결제일과 그 이전 7일 안에 고시된 환율이 없습니다.

            **오류 코드:** `EXCHANGE_RATE_NOT_PUBLISHED`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXCHANGE_RATE_NOT_PUBLISHED:
                  summary: 고시된 환율이 없음
                  value:
                    code: EXCHANGE_RATE_NOT_PUBLISHED
                    message: 선택한 날짜 전후에 고시된 환율이 없습니다. 환율을 직접 입력해 주세요.
                    errors: null
        '503':
          description: |
            고시 기관의 장애, 시간 초과나 해석할 수 없는 응답으로 환율을 조회하지 못했습니다. 고시값이 없다는 뜻이 아닙니다.

            **오류 코드:** `EXCHANGE_RATE_PROVIDER_UNAVAILABLE`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXCHANGE_RATE_PROVIDER_UNAVAILABLE:
                  summary: 외부 환율을 조회할 수 없음
                  value:
                    code: EXCHANGE_RATE_PROVIDER_UNAVAILABLE
                    message: 환율을 일시적으로 조회할 수 없습니다. 환율을 직접 입력하거나 잠시 후 다시 시도해 주세요.
                    errors: null
  "/api/v1/trips/{tripId}/exchange-rates":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    get:
      tags:
      - ExchangeRate
      operationId: listExchangeRates
      summary: 내 환율 목록 조회
      description: |
        이 여행에 본인이 등록한 개인 환율을 페이지 단위로 조회합니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자만 요청할 수 있습니다. 요청한 회원이 이 여행에 등록한 기록만 조회하며, 다른 참여자의 기록은 조회할 수 없습니다.

        ### 처리 조건
        최초 등록 시각(createdAt)이 늦은 기록부터 정렬하며, 같으면 기록 ID가 큰 기록을 먼저 둡니다. 환전 날짜(exchangeDate)와 수정 시각은 순서에 영향을 주지 않습니다.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "../common/components.yml#/parameters/Page"
      - "$ref": "../common/components.yml#/parameters/Size"
      responses:
        '200':
          description: 내 환율 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - page
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: 등록한 기록이 없거나 마지막 페이지를 넘으면 빈 목록입니다.
                    items:
                      "$ref": "./exchange-rate.yml#/components/schemas/PersonalRate"
                  page:
                    "$ref": "../common/components.yml#/schemas/PageInfo"
              examples:
                success:
                  summary: 내 환율 목록 조회 성공
                  value:
                    data:
                    - exchangeRateId: '702'
                      currency: USD
                      rate: '1358.73'
                      exchangeMethod: TRAVEL_CARD
                      exchangeDate: '2026-11-06'
                      createdAt: '2026-11-06T03:00:00Z'
                    - exchangeRateId: '701'
                      currency: JPY
                      rate: '9.12'
                      exchangeMethod: CASH
                      exchangeDate: '2026-11-05'
                      createdAt: '2026-11-05T03:00:00Z'
                    page:
                      page: 0
                      size: 20
                      totalElements: 2
                      hasNext: false
                emptyResult:
                  summary: 등록한 기록이 없음
                  value:
                    data: []
                    page:
                      page: 0
                      size: 20
                      totalElements: 0
                      hasNext: false
        '400':
          description: |
            page가 0보다 작거나 정수가 아니거나, size가 1~100을 벗어나거나 정수가 아닙니다.

            **오류 코드:** `COMMON_INVALID_REQUEST`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_INVALID_REQUEST:
                  summary: size가 범위를 벗어남
                  value:
                    code: COMMON_INVALID_REQUEST
                    message: 요청이 올바르지 않습니다.
                    errors: null
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          description: |
            요청한 회원이 이 여행에 참여하지 않았거나 여행을 나갔습니다.

            **오류 코드:** `COMMON_FORBIDDEN`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_FORBIDDEN:
                  summary: 참여 중인 여행이 아님
                  value:
                    code: COMMON_FORBIDDEN
                    message: 요청을 수행할 권한이 없습니다.
                    errors: null
        '404':
          description: |
            tripId에 해당하는 여행이 없거나 삭제됐습니다.

            **오류 코드:** `COMMON_NOT_FOUND`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_NOT_FOUND:
                  summary: 여행이 없거나 삭제됨
                  value:
                    code: COMMON_NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다.
                    errors: null
    post:
      tags:
      - ExchangeRate
      operationId: createExchangeRate
      summary: 개인 환율 등록
      description: |
        본인의 환전 환율을 환전 날짜와 환전 수단과 함께 이 여행에 기록합니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자만 요청할 수 있습니다. 요청한 회원의 여행 참여자가 기록의 등록자가 되며, 요청으로 등록자를 정할 수 없습니다.

        ### 처리 조건
        같은 여행에서 본인이 통화, 환전 날짜, 환전 수단과 환율이 모두 같은 기록을 이미 등록했으면 409로 거절합니다. 환율이 같아도 환전 날짜, 환전 수단이나 통화가 다르면 별개 기록으로 저장합니다.
        환율은 0보다 크고 정수부 10자리 이하인 소수점 이하 2자리 값입니다.

        ### 사용 시 주의
        같은 기록을 동시에 등록해도 한 건만 저장하고 나머지 요청은 409로 응답합니다. 등록한 기록을 수정하거나 삭제하는 API는 아직 없습니다.
        한 건을 조회하는 API가 없으므로 응답에 Location 헤더가 없습니다. 환전 날짜는 기록용이며 이미 저장한 지출의 환율과 부담액을 바꾸지 않습니다.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "./exchange-rate.yml#/components/schemas/PersonalRateInput"
            examples:
              cash:
                summary: 현금으로 환전한 JPY 환율
                value:
                  currency: JPY
                  rate: '9.12'
                  exchangeMethod: CASH
                  exchangeDate: '2026-11-05'
      responses:
        '201':
          description: 개인 환율 등록 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./exchange-rate.yml#/components/schemas/PersonalRate"
              examples:
                success:
                  summary: 개인 환율 등록 성공
                  value:
                    data:
                      exchangeRateId: '701'
                      currency: JPY
                      rate: '9.12'
                      exchangeMethod: CASH
                      exchangeDate: '2026-11-05'
                      createdAt: '2026-11-05T03:00:00Z'
        '400':
          description: |
            필수값이 없거나 정의하지 않은 필드를 보냈습니다. currency가 KRW이거나 지원하지 않는 통화이거나, rate가 0 이하이거나 정수부 10자리 이하, 소수점 이하 2자리 형식이 아니거나, exchangeMethod가 CASH, TRAVEL_CARD가 아니거나, exchangeDate가 YYYY-MM-DD 형식의 날짜가 아닙니다.

            **오류 코드:** `COMMON_INVALID_REQUEST`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_INVALID_REQUEST:
                  summary: KRW 요청
                  value:
                    code: COMMON_INVALID_REQUEST
                    message: 요청이 올바르지 않습니다.
                    errors:
                    - field: currency
                      reason: 허용되지 않는 값입니다.
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          description: |
            요청한 회원이 이 여행에 참여하지 않았거나 여행을 나갔습니다.

            **오류 코드:** `COMMON_FORBIDDEN`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_FORBIDDEN:
                  summary: 참여 중인 여행이 아님
                  value:
                    code: COMMON_FORBIDDEN
                    message: 요청을 수행할 권한이 없습니다.
                    errors: null
        '404':
          description: |
            tripId에 해당하는 여행이 없거나 삭제됐습니다.

            **오류 코드:** `COMMON_NOT_FOUND`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_NOT_FOUND:
                  summary: 여행이 없거나 삭제됨
                  value:
                    code: COMMON_NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다.
                    errors: null
        '409':
          description: |
            같은 여행에 본인이 통화, 환전 날짜, 환전 수단과 환율이 모두 같은 기록을 이미 등록했습니다.

            **오류 코드:** `EXCHANGE_RATE_DUPLICATED`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXCHANGE_RATE_DUPLICATED:
                  summary: 같은 기록을 이미 등록함
                  value:
                    code: EXCHANGE_RATE_DUPLICATED
                    message: 같은 통화, 환전 날짜, 환전 수단과 환율의 기록을 이미 등록했습니다.
                    errors: null
components:
  schemas:
    PersonalRate:
      type: object
      description: 본인이 등록한 개인 환율 기록입니다.
      required:
      - exchangeRateId
      - currency
      - rate
      - exchangeMethod
      - exchangeDate
      - createdAt
      additionalProperties: false
      properties:
        exchangeRateId:
          allOf:
          - "$ref": "../common/components.yml#/schemas/ResourceId"
          description: 개인 환율 기록 ID입니다.
          example: '701'
        currency:
          type: string
          enum:
          - JPY
          - USD
          - EUR
          - CNY
          description: 환전한 외화의 통화입니다.
          example: JPY
        rate:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 외화 1단위당 원화 금액입니다. 0보다 크고 정수부 10자리 이하입니다.
          example: '9.12'
        exchangeMethod:
          type: string
          enum:
          - CASH
          - TRAVEL_CARD
          description: 환전 수단입니다. CASH는 현금, TRAVEL_CARD는 트래블 카드입니다.
          example: CASH
        exchangeDate:
          type: string
          format: date
          description: 회원이 입력한 환전 당시의 현지 날짜입니다. 시각은 수집하지 않으며 UTC로 변환하지 않습니다.
          example: '2026-11-05'
        createdAt:
          type: string
          format: date-time
          description: 최초 등록 시각(UTC)입니다. 최근 기록을 고르는 기준입니다.
          example: '2026-11-05T03:00:00Z'
    PersonalRateInput:
      type: object
      description: 개인 환율 등록 요청입니다.
      required:
      - currency
      - rate
      - exchangeMethod
      - exchangeDate
      additionalProperties: false
      properties:
        currency:
          type: string
          enum:
          - JPY
          - USD
          - EUR
          - CNY
          description: 환전한 외화의 통화입니다. KRW는 거절합니다.
          example: JPY
        rate:
          type: string
          pattern: ^[0-9]{1,10}\.[0-9]{2}$
          description: 외화 1단위당 원화 금액입니다. 0보다 크고 정수부 10자리 이하인 소수점 이하 2자리 문자열만 받습니다.
          example: '9.12'
        exchangeMethod:
          type: string
          enum:
          - CASH
          - TRAVEL_CARD
          description: 환전 수단입니다. CASH는 현금, TRAVEL_CARD는 트래블 카드입니다.
          example: CASH
        exchangeDate:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: 회원이 입력한 환전 당시의 현지 날짜입니다. 기록용이며 이미 저장한 지출에 적용할 기간을 정하지 않습니다.
          example: '2026-11-05'
    ReferenceRate:
      type: object
      description: 결제일에 적용하는 고시 환율입니다.
      required:
      - currency
      - rate
      - provider
      - baseDate
      additionalProperties: false
      properties:
        currency:
          type: string
          enum:
          - JPY
          - USD
          - EUR
          - CNY
          description: 환율의 기준이 되는 결제 통화입니다.
          example: JPY
        rate:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 결제 통화 1단위당 원화 금액입니다. 고시 기관의 환율을 소수점 셋째 자리에서 반올림한 값입니다.
          example: '9.12'
        provider:
          type: string
          description: 환율을 고시한 기관의 코드입니다. ECB는 유럽중앙은행입니다.
          example: ECB
        baseDate:
          type: string
          format: date
          description: 환율의 실제 고시 기준일입니다. 휴일이면 요청한 paidDate보다 이전이며, 최대 7일 전까지입니다.
          example: '2026-11-05'

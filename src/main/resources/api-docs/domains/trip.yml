---
paths:
  "/api/v1/trips":
    get:
      tags:
      - Trip
      operationId: getTrips
      summary: 여행 목록 조회
      description: 요청자가 참여 중인 여행을 페이지 구분 없이 모두 조회합니다. 가입을 완료한 회원만 요청할 수 있습니다. 서버는 필터와 정렬을 적용하지
        않습니다. FE가 membersLockedAt과 startDate, endDate로 참여자 초대중, 여행 예정, 진행 중, 여행 종료를 구분하고 startDate 기준으로
        정렬합니다. 오늘 날짜는 사용자 기기의 현지 날짜를 기준으로 판단합니다.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 조회 성공. 참여 중인 여행이 없으면 빈 목록을 반환합니다.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "./trip.yml#/components/schemas/TripListItem"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
    post:
      tags:
      - Trip
      operationId: createTrip
      summary: 여행 생성
      description: 여행 기본 정보와 정원을 입력해 새 여행을 생성합니다. 가입을 완료한 회원만 요청할 수 있으며 생성자가 관리자가 됩니다. 앱은 생성 요청마다
        Idempotency-Key 헤더에 고유키를 보내고, 응답을 받지 못해 같은 요청을 다시 보낼 때는 같은 키를 사용합니다. 서버는 같은 키의 재요청에 새
        여행을 만들지 않고 처음 만든 여행을 반환합니다.
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 여행 생성 요청의 고유키. 앱이 요청마다 UUID로 만들고, 같은 요청을 다시 보낼 때는 같은 값을 사용합니다.
        schema:
          type: string
          format: uuid
          example: 3f1c2b8e-6a4d-4e2f-9b7a-1c5d8e0f2a6b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "./trip.yml#/components/schemas/TripCreate"
            example:
              name: 도쿄 여행
              countryCode: JP
              baseCurrency: JPY
              startDate: '2026-11-05'
              endDate: '2026-11-07'
              memberCapacity: 3
      responses:
        '201':
          description: 생성 성공
          headers:
            Location:
              description: 생성한 여행의 URI
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./trip.yml#/components/schemas/TripSummary"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
  "/api/v1/trips/{tripId}":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    get:
      tags:
      - Trip
      operationId: getTrip
      summary: 여행 상세
      description: 여행 상세 진입에 필요한 기본 정보와 참여자 목록을 함께 조회합니다. 해당 여행에 참여한 회원만 요청할 수 있습니다.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./trip.yml#/components/schemas/TripDetail"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          "$ref": "../common/components.yml#/responses/Forbidden"
        '404':
          "$ref": "../common/components.yml#/responses/NotFound"
    patch:
      tags:
      - Trip
      operationId: updateTrip
      summary: 여행 정보 수정
      description: 여행 기본 정보와 정원을 일부 수정합니다. 보낸 필드만 변경하고 생략한 필드는 유지합니다. 해당 여행의 관리자만 요청할 수 있습니다. 여행 확정
        후에는 정원을 변경할 수 없습니다.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "./trip.yml#/components/schemas/TripUpdate"
            example:
              name: 오사카 여행
              memberCapacity: 4
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./trip.yml#/components/schemas/TripSummary"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          "$ref": "../common/components.yml#/responses/Forbidden"
        '404':
          "$ref": "../common/components.yml#/responses/NotFound"
        '409':
          description: 확정 후 정원을 변경하거나 등록 인원보다 정원을 줄이려 함. TRIP_CAPACITY_CHANGE_NOT_ALLOWED
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
    delete:
      tags:
      - Trip
      operationId: deleteTrip
      summary: 여행 삭제
      description: 지출과 정산 기록이 없는 여행을 삭제하고 모든 참여자의 접근을 차단합니다. 해당 여행의 관리자만 요청할 수 있습니다.
      security:
      - bearerAuth: []
      responses:
        '204':
          "$ref": "../common/components.yml#/responses/NoContent"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          "$ref": "../common/components.yml#/responses/Forbidden"
        '404':
          "$ref": "../common/components.yml#/responses/NotFound"
        '409':
          description: 삭제를 막는 지출 또는 정산 기록이 존재함. TRIP_RECORDS_EXIST
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
  "/api/v1/trips/{tripId}/invitation":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    get:
      tags:
      - Trip
      operationId: getTripInvitation
      summary: 초대 정보 조회
      description: 공유할 초대 코드와 초대 링크를 조회합니다. 여행 확정 전, 해당 여행의 관리자만 요청할 수 있습니다.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./trip.yml#/components/schemas/Invitation"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          "$ref": "../common/components.yml#/responses/Forbidden"
        '404':
          "$ref": "../common/components.yml#/responses/NotFound"
        '409':
          description: 확정 후 초대 정보를 요청함. TRIP_ALREADY_CONFIRMED
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
  "/api/v1/trip-invitations":
    get:
      tags:
      - Trip
      operationId: searchTripInvitation
      summary: 초대 코드 검색
      description: 초대 코드에 해당하는 여행의 참여 전 확인 정보를 조회합니다. 가입을 완료한 회원만 요청할 수 있습니다. 검색만으로 참여하거나 빈자리를 배정하지
        않습니다.
      security:
      - bearerAuth: []
      parameters:
      - name: code
        in: query
        required: true
        description: 공유받은 초대 코드. 서버는 앞뒤 공백을 지우고 대소문자를 구분하지 않고 비교합니다.
        schema:
          type: string
          example: A7K2PQ
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./trip.yml#/components/schemas/InvitationSearch"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '404':
          description: 해당 코드로 검색 가능한 여행이 없음. TRIP_INVITATION_NOT_FOUND
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
  "/api/v1/trip-memberships":
    post:
      tags:
      - Trip
      operationId: joinTripByInviteCode
      summary: 여행 참여
      description: 초대 코드로 여행에 참여하고 본인의 참여 식별자를 반환합니다. 가입을 완료한 회원만 요청할 수 있습니다. 최초 참여는 201, 이미 참여 중인
        본인의 재요청은 기존 참여 정보와 200을 반환합니다.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "./trip.yml#/components/schemas/InviteCodeInput"
            example:
              inviteCode: A7K2PQ
      responses:
        '200':
          description: 이미 참여 중인 본인의 재요청. 기존 참여 정보를 반환합니다.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./trip.yml#/components/schemas/Membership"
        '201':
          description: 최초 참여 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./trip.yml#/components/schemas/Membership"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '409':
          description: 신규 참여자가 확정된 여행에 참여하려 함(TRIP_ALREADY_CONFIRMED) 또는 빈자리가 없음(TRIP_CAPACITY_FULL)
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
  "/api/v1/trips/{tripId}/guests":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    post:
      tags:
      - Trip
      operationId: createTripGuest
      summary: 비로그인 참여자 등록
      description: 빈자리에 이름을 입력해 비로그인 참여자를 한 명씩 등록합니다. 이름은 같은 여행 안에서 로그인 참여자의 닉네임, 다른 비로그인 참여자의 이름과 모두 중복할 수 없습니다. 여행 확정 전, 해당
        여행의 관리자만 요청할 수 있습니다.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "./trip.yml#/components/schemas/GuestInput"
            example:
              name: 서연
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./trip.yml#/components/schemas/Guest"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          "$ref": "../common/components.yml#/responses/Forbidden"
        '404':
          "$ref": "../common/components.yml#/responses/NotFound"
        '409':
          description: 확정 후 비로그인 참여자를 추가하려 함(TRIP_ALREADY_CONFIRMED), 등록할 빈자리가 없음(TRIP_CAPACITY_FULL) 또는 같은 여행 안에
            이미 같은 이름이 있음(TRIP_GUEST_NAME_DUPLICATED)
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
  "/api/v1/trips/{tripId}/leave":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    post:
      tags:
      - Trip
      operationId: leaveTrip
      summary: 여행 나가기
      description: 본인의 여행 참여를 종료하고 참여 중 목록에서 제거합니다. 나간 상태와 과거 기록 연결은 유지합니다. 해당 여행의 일반 참여자가 요청할 수 있으며
        관리자의 나가기 허용 여부는 미정입니다.
      security:
      - bearerAuth: []
      responses:
        '204':
          "$ref": "../common/components.yml#/responses/NoContent"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          "$ref": "../common/components.yml#/responses/Forbidden"
        '404':
          "$ref": "../common/components.yml#/responses/NotFound"
  "/api/v1/trips/{tripId}/confirm":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    post:
      tags:
      - Trip
      operationId: confirmTrip
      summary: 여행 확정
      description: 여행 참여자 구성을 확정합니다. 확정 후에는 신규 참여, 비로그인 참여자 등록과 정원 변경을 할 수 없습니다. 해당 여행의 관리자만 요청할 수
        있습니다. 빈자리가 남아 있으면 확정할 수 없습니다. FE가 버튼을 비활성화해도 서버가 같은 조건을 다시 확인합니다.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 확정 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./trip.yml#/components/schemas/TripConfirmation"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          "$ref": "../common/components.yml#/responses/Forbidden"
        '404':
          "$ref": "../common/components.yml#/responses/NotFound"
        '409':
          description: 이미 확정된 여행(TRIP_ALREADY_CONFIRMED) 또는 빈자리가 남아 있음(TRIP_VACANCY_REMAINING)
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: 여행 ID
      schema:
        "$ref": "../common/components.yml#/schemas/ResourceId"
  schemas:
    Currency:
      type: string
      enum:
      - KRW
      - JPY
      - USD
      - EUR
      - CNY
      description: 여행 기준 통화
    CountryCode:
      type: string
      pattern: "^[A-Z]{2}$"
      description: 대표 국가. ISO 3166-1 alpha-2 국가 코드(영문 대문자 2자리)입니다. 한국 KR, 일본 JP, 미국 US, 중국 CN이며 유럽은 ISO 3166-1의
        예외적 예약 코드(exceptionally reserved)인 EU를 사용합니다. 기타는 사용자가 고른 해당 국가의 코드를 사용합니다(베트남이면 VN).
      example: JP
    TripRole:
      type: string
      enum:
      - ADMIN
      - MEMBER
      description: ADMIN은 이 여행의 관리자, MEMBER는 일반 참여자입니다.
    TripSummary:
      type: object
      required:
      - tripId
      - name
      - startDate
      - endDate
      - countryCode
      - baseCurrency
      - memberCapacity
      - registeredMemberCount
      - membersLockedAt
      - myRole
      additionalProperties: false
      properties:
        tripId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        name:
          type: string
          example: 도쿄 여행
        startDate:
          type: string
          format: date
          example: '2026-11-05'
        endDate:
          type: string
          format: date
          example: '2026-11-07'
        countryCode:
          "$ref": "./trip.yml#/components/schemas/CountryCode"
        baseCurrency:
          "$ref": "./trip.yml#/components/schemas/Currency"
        memberCapacity:
          type: integer
          minimum: 1
          maximum: 10
          description: 생성자를 포함한 총 정원
          example: 3
        registeredMemberCount:
          type: integer
          minimum: 0
          description: 회원과 비로그인 참여자의 합. 빈자리는 제외합니다.
          example: 3
        membersLockedAt:
          type: string
          format: date-time
          nullable: true
          description: 여행 확정 시각(UTC). 확정 전에는 null입니다.
        myRole:
          "$ref": "./trip.yml#/components/schemas/TripRole"
    TripListItem:
      type: object
      description: 여행 목록 항목. 기본 필드의 정의는 TripSummary와 같고, 여행 카드에 표시할 사용 금액(totalKrwAmount)을 추가합니다. 사용 금액은
        서버가 해당 여행 지출의 원화 환산액(expense.krw_amount)을 합해 계산한 원화 금액입니다.
      required:
      - tripId
      - name
      - startDate
      - endDate
      - countryCode
      - baseCurrency
      - memberCapacity
      - registeredMemberCount
      - membersLockedAt
      - myRole
      - totalKrwAmount
      additionalProperties: false
      properties:
        tripId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        name:
          type: string
          example: 도쿄 여행
        startDate:
          type: string
          format: date
          example: '2026-11-05'
        endDate:
          type: string
          format: date
          example: '2026-11-07'
        countryCode:
          "$ref": "./trip.yml#/components/schemas/CountryCode"
        baseCurrency:
          "$ref": "./trip.yml#/components/schemas/Currency"
        memberCapacity:
          type: integer
          minimum: 1
          maximum: 10
          example: 3
        registeredMemberCount:
          type: integer
          minimum: 0
          example: 3
        membersLockedAt:
          type: string
          format: date-time
          nullable: true
        myRole:
          "$ref": "./trip.yml#/components/schemas/TripRole"
        totalKrwAmount:
          "$ref": "../common/components.yml#/schemas/DecimalString"
    TripDetail:
      type: object
      description: 여행 기본 정보와 참여자 목록. 기본 필드의 정의는 TripSummary와 같습니다.
      required:
      - tripId
      - name
      - startDate
      - endDate
      - countryCode
      - baseCurrency
      - memberCapacity
      - registeredMemberCount
      - membersLockedAt
      - myRole
      - participants
      additionalProperties: false
      properties:
        tripId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        name:
          type: string
          example: 도쿄 여행
        startDate:
          type: string
          format: date
          example: '2026-11-05'
        endDate:
          type: string
          format: date
          example: '2026-11-07'
        countryCode:
          "$ref": "./trip.yml#/components/schemas/CountryCode"
        baseCurrency:
          "$ref": "./trip.yml#/components/schemas/Currency"
        memberCapacity:
          type: integer
          minimum: 1
          maximum: 10
          example: 3
        registeredMemberCount:
          type: integer
          minimum: 0
          example: 3
        membersLockedAt:
          type: string
          format: date-time
          nullable: true
        myRole:
          "$ref": "./trip.yml#/components/schemas/TripRole"
        participants:
          type: array
          description: 참여자 목록. 관리자가 맨 앞이고, 그다음은 자리에 배정된 순서이며, 빈자리는 맨 뒤에 둡니다. 빈자리는 isVacant가 true이고
            memberId와 displayName이 null입니다.
          items:
            "$ref": "./trip.yml#/components/schemas/Participant"
    TripCreate:
      type: object
      required:
      - name
      - countryCode
      - baseCurrency
      - startDate
      - endDate
      - memberCapacity
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 15
          pattern: "^[가-힣A-Za-z0-9 ]+$"
          description: 최대 15자. 한글, 영문, 숫자와 공백만 허용하고 특수문자는 금지합니다.
        countryCode:
          "$ref": "./trip.yml#/components/schemas/CountryCode"
        baseCurrency:
          "$ref": "./trip.yml#/components/schemas/Currency"
        startDate:
          type: string
          format: date
          description: 여행 시작일. 과거 날짜를 허용합니다.
        endDate:
          type: string
          format: date
          description: 여행 종료일. startDate 이상이며 당일 여행을 허용합니다.
        memberCapacity:
          type: integer
          minimum: 1
          maximum: 10
          description: 생성자를 포함한 총 정원
    TripUpdate:
      type: object
      description: 보낸 필드만 수정하고 생략한 필드는 유지합니다. 각 필드의 규칙은 TripCreate와 같습니다. 필드를 하나도 보내지 않으면 400으로
        거절합니다.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 15
          pattern: "^[가-힣A-Za-z0-9 ]+$"
        countryCode:
          "$ref": "./trip.yml#/components/schemas/CountryCode"
        baseCurrency:
          "$ref": "./trip.yml#/components/schemas/Currency"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        memberCapacity:
          type: integer
          minimum: 1
          maximum: 10
          description: 확정 후에는 변경할 수 없으며 등록 인원보다 작게 줄일 수 없습니다.
    Participant:
      type: object
      required:
      - tripMemberId
      - memberId
      - displayName
      - role
      - isVacant
      additionalProperties: false
      properties:
        tripMemberId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        memberId:
          type: string
          nullable: true
          description: Billit 회원 계정 ID. 비로그인 참여자와 빈자리이면 null입니다.
        displayName:
          type: string
          nullable: true
          description: 표시 이름. 빈자리이면 null입니다. 중복 이름을 식별자로 사용하지 않습니다.
        role:
          "$ref": "./trip.yml#/components/schemas/TripRole"
        isVacant:
          type: boolean
          description: 아무 참여자도 배정되지 않은 자리이면 true입니다.
    Invitation:
      type: object
      required:
      - inviteCode
      - inviteUrl
      additionalProperties: false
      properties:
        inviteCode:
          type: string
          pattern: "^[A-Z0-9]{6}$"
          description: 초대 코드. 영문 대문자와 숫자로 된 6자입니다. 1차 MVP에서는 만료와 재발급이 없습니다.
          example: A7K2PQ
        inviteUrl:
          type: string
          format: uri
          description: 초대 링크. 열기만 해서는 참여하지 않습니다.
          example: https://example.com/invitations/A7K2PQ
    InvitationSearch:
      type: object
      required:
      - tripId
      - name
      - startDate
      - endDate
      - registeredMemberCount
      - memberCapacity
      - isAlreadyJoined
      additionalProperties: false
      properties:
        tripId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        name:
          type: string
          example: 도쿄 여행
        startDate:
          type: string
          format: date
          example: '2026-11-05'
        endDate:
          type: string
          format: date
          example: '2026-11-07'
        registeredMemberCount:
          type: integer
          minimum: 0
          example: 2
        memberCapacity:
          type: integer
          minimum: 1
          maximum: 10
          example: 3
        isAlreadyJoined:
          type: boolean
          description: 요청자가 이미 참여 중인지 여부
    InviteCodeInput:
      type: object
      required:
      - inviteCode
      additionalProperties: false
      properties:
        inviteCode:
          type: string
          description: 공유받은 초대 코드. 영문 대문자와 숫자로 된 6자이며, 서버는 앞뒤 공백을 지우고 대소문자를 구분하지 않고 비교합니다.
          example: A7K2PQ
    Membership:
      type: object
      required:
      - tripId
      - tripMemberId
      additionalProperties: false
      properties:
        tripId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        tripMemberId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
    GuestInput:
      type: object
      required:
      - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 10
          description: 비로그인 참여자 이름. 최대 10자이며, 같은 여행 안에서 로그인 참여자의 닉네임과 다른 비로그인 참여자의 이름 모두와 중복할 수 없습니다.
    Guest:
      type: object
      required:
      - tripMemberId
      - name
      additionalProperties: false
      properties:
        tripMemberId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        name:
          type: string
          example: 서연
    TripConfirmation:
      type: object
      required:
      - tripId
      - membersLockedAt
      additionalProperties: false
      properties:
        tripId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        membersLockedAt:
          type: string
          format: date-time
          description: 여행 확정 시각(UTC)

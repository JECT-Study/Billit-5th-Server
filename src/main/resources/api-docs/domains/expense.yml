        '400':
          description: |
            요청 형식이나 값이 올바르지 않거나, 부담자와 금액이 지출 수정 조건에 맞지 않습니다.

            | 오류 코드 | 발생 조건 |
            | --- | --- |
            | `COMMON_INVALID_REQUEST` | X-Lock-Token이 없거나 UUID 형식이 아니거나, tripId나 expenseId가 숫자 ID가 아니거나, 요청 본문이 필드 형식과 범위를 벗어났습니다. 분배 방식에 맞지 않는 tripMemberIds나 items, 통화의 최소 단위보다 작은 소수, KRW 지출의 1.00이 아닌 환율, 상품 할인이 품목 금액보다 큰 품목, 0 미만인 최종 결제액과 정수부가 10자리를 넘는 원화 환산액도 포함합니다. |
            | `EXPENSE_INVALID_SHARES` | 새로 지정한 결제자가 이 여행에 참여 중인 로그인 참여자가 아니거나, 부담자가 없거나 겹치거나 새로 지정한 부담자가 이 여행에 참여 중인 로그인 참여자나 비로그인 참여자가 아닙니다. |
            | `EXPENSE_AMOUNT_MISMATCH` | 품목별 지출에서 상품 할인 전 품목 금액의 합계가 originalAmount와 다릅니다. |
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_INVALID_REQUEST:
                  summary: 잠금 토큰이나 요청 본문이 올바르지 않음
                  value:
                    code: COMMON_INVALID_REQUEST
                    message: 요청이 올바르지 않습니다.
                    errors: null
                EXPENSE_INVALID_SHARES:
                  summary: 결제자나 부담자로 지정할 수 없는 참여자
                  value:
                    code: EXPENSE_INVALID_SHARES
                    message: 결제자나 부담자로 지정할 수 없는 참여자가 있습니다.
                    errors: null
                EXPENSE_AMOUNT_MISMATCH:
                  summary: 품목 금액 합계가 총액과 다름
                  value:
                    code: EXPENSE_AMOUNT_MISMATCH
                    message: 품목 금액의 합계가 결제 총액과 다릅니다.
                    errors: null
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          description: |
            요청한 회원이 이 여행에 참여하지 않았거나 여행을 나갔거나, 지출 기록자도 여행 관리자도 아닙니다.

            **오류 코드:** `COMMON_FORBIDDEN`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_FORBIDDEN:
                  summary: 수정할 수 있는 참여자가 아님
                  value:
                    code: COMMON_FORBIDDEN
                    message: 요청을 수행할 권한이 없습니다.
                    errors: null
        '404':
          description: |
            tripId에 해당하는 여행이 없거나 삭제됐거나, expenseId에 해당하는 지출이 없거나 삭제됐거나 이 여행의 지출이 아닙니다.

            **오류 코드:** `COMMON_NOT_FOUND`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_NOT_FOUND:
                  summary: 여행이나 지출이 없거나 삭제됨
                  value:
                    code: COMMON_NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다.
                    errors: null
        '409':
          description: |
            요청한 회원의 유효한 수정 잠금이 없거나 지출이 정산에 포함돼 있습니다. 지출과 기존 잠금은 그대로 둡니다.

            | 오류 코드 | 발생 조건 |
            | --- | --- |
            | `EXPENSE_EDIT_LOCK_INVALID` | 요청한 회원의 잠금이 아니거나, 토큰이 현재 수정 작업과 다르거나, 잠금이 없거나 만료됐습니다. 수정에 성공한 뒤 같은 토큰으로 다시 보낸 요청도 같습니다. |
            | `EXPENSE_SETTLEMENT_LOCKED` | 지출이 준비 중이거나 발행된 정산에 포함돼 있습니다. |
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXPENSE_EDIT_LOCK_INVALID:
                  summary: 만료됐거나 다른 수정 작업의 잠금
                  value:
                    code: EXPENSE_EDIT_LOCK_INVALID
                    message: 수정 가능 시간이 지났거나 다른 화면에서 수정을 시작했습니다. 다시 수정해주세요.
                    errors: null
                EXPENSE_SETTLEMENT_LOCKED:
                  summary: 정산에 포함된 지출
                  value:
                    code: EXPENSE_SETTLEMENT_LOCKED
                    message: 정산 중이거나 정산한 지출은 수정할 수 없습니다.
                    errors: null
  "/api/v1/trips/{tripId}/expenses/{expenseId}/edit-lock":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    - "$ref": "./expense.yml#/components/parameters/ExpenseId"
    post:
      tags:
      - Expense
      operationId: acquireExpenseEditLock
      summary: 지출 수정 잠금 획득
      description: |
        지출 수정을 시작하며 다른 참여자가 같은 지출을 수정하거나 삭제하지 못하게 잠그고, 이 수정 작업의 잠금 토큰과 만료 시각을 발급합니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자 중 지출을 기록한 회원이나 여행 관리자만 요청할 수 있습니다. 결제자라는 이유만으로는 요청할 수 없습니다.

        ### 처리 조건
        정산에 포함되지 않았고 만료되지 않은 수정 잠금이 없는 지출만 잠글 수 있습니다. 만료된 잠금은 새 잠금으로 바꿉니다.
        잠금은 서버 시각 기준으로 획득 후 5분 동안 유효하며, 만료 시각은 초 단위로 내립니다. 잠금 획득은 지출의 수정 시각을 바꾸지 않습니다.

        ### 사용 시 주의
        요청할 때마다 새 잠금 토큰을 발급하며, 같은 회원이라도 유효한 잠금이 있으면 새 토큰으로 바꾸지 않고 409 EXPENSE_EDIT_LOCKED로 거절합니다. 앱은 받은 토큰으로 잠금을 연장합니다.
      security:

                  name: Dinner
                  splitType: BY_ITEM
                  currency: USD
                  paidDate: '2026-11-06'
                  paymentMethod: TRAVEL_CARD
                  payerTripMemberId: '201'
                  originalAmount: '12.34'
                  discountAmount: '0.34'
                  exchangeRate: '1380.55'
                  exchangeRateSource: AUTO
                  items:
                  - name: 피자
                    amount: '10.00'
                    discountAmount: '1.00'
                    tripMemberIds:
                    - '201'
                    - '202'
                  - amount: '2.34'
                    discountAmount: '0.00'
                    tripMemberIds:
                    - '201'
      responses:
        '200':
          description: 지출 수정 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./expense.yml#/components/schemas/ExpenseDetail"
              examples:
                equal:
                  summary: 전체 1/N 지출로 수정 성공
                  value:
                    data:
                      expenseId: '501'
                      name: 저녁 식사
                      paidDate: '2026-11-05'
                      currency: KRW
                      amount: '14000.00'
                      payerTripMemberId: '201'
                      settlementId: null
                      isEditLocked: false
                      tripId: '123'
                      splitType: EQUAL
                      createdByTripMemberId: '201'
                      paymentMethod: CARD
                      originalAmount: '15000.00'
                      discountAmount: '1000.00'
                      exchangeRate: '1.00'
                      exchangeRateSource: MANUAL
                      exchangeRateProvider: null
                      exchangeRateBaseDate: null
                      amountKrw: '14000.00'
                      items: []
                      shares:
                      - tripMemberId: '201'
                        amount: '7000.00'
                        amountKrw: '7000.00'
                      - tripMemberId: '202'
                        amount: '7000.00'
                        amountKrw: '7000.00'
                byItem:
                  summary: 품목별 지출로 수정 성공
                  description: 품목을 다시 저장해 expenseItemId가 수정 전과 다릅니다.
                  value:
                    data:
                      expenseId: '501'

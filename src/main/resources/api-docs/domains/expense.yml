      description: |
        현재 수정 작업의 잠금 만료 시각을 늦춥니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자 중 지출을 기록한 회원이나 여행 관리자만 요청할 수 있으며, 요청한 회원이 획득한 잠금의 토큰을 보내야 합니다.

        ### 처리 조건
        만료되기 전의 잠금만 연장할 수 있습니다. 요청할 때마다 기존 만료 시각에 2분을 더하며, 연장 횟수와 총 시간의 상한은 없습니다. 연장은 지출의 수정 시각을 바꾸지 않습니다.

        ### 사용 시 주의
        만료된 잠금은 되살리지 않으므로 앱은 잠금을 다시 획득해야 합니다. 같은 잠금에 연장 요청이 여러 번 도착하면 요청마다 2분씩 늘어나며, 응답의 expiresAt은 그 요청을 반영한 뒤의 만료 시각입니다.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "./expense.yml#/components/parameters/LockToken"
      responses:
        '200':
          description: 수정 잠금 연장 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./expense.yml#/components/schemas/LockExpiry"
              examples:
                success:
                  summary: 수정 잠금 연장 성공
                  value:
                    data:
                      expiresAt: '2026-11-05T03:07:00Z'
        '400':
          description: |
            X-Lock-Token이 없거나 UUID 형식이 아니거나, tripId나 expenseId가 숫자 ID가 아닙니다.

            **오류 코드:** `COMMON_INVALID_REQUEST`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_INVALID_REQUEST:
                  summary: 잠금 토큰이 없거나 형식이 올바르지 않음
                  value:
                    code: COMMON_INVALID_REQUEST
                    message: 요청이 올바르지 않습니다.
                    errors: null
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          description: |
            요청한 회원이 이 여행에 참여하지 않았거나 여행을 나갔거나, 지출 기록자도 여행 관리자도 아닙니다.

            **오류 코드:** `COMMON_FORBIDDEN`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_FORBIDDEN:
                  summary: 수정할 수 있는 참여자가 아님
                  value:
                    code: COMMON_FORBIDDEN
                    message: 요청을 수행할 권한이 없습니다.
                    errors: null
        '404':
          description: |
            tripId에 해당하는 여행이 없거나 삭제됐거나, expenseId에 해당하는 지출이 없거나 삭제됐거나 이 여행의 지출이 아닙니다.

            **오류 코드:** `COMMON_NOT_FOUND`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_NOT_FOUND:
                  summary: 여행이나 지출이 없거나 삭제됨
                  value:
                    code: COMMON_NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다.
                    errors: null
        '409':
          description: |
            요청한 회원의 잠금이 아니거나, 토큰이 현재 수정 작업과 다르거나, 잠금이 없거나 만료됐습니다.

            **오류 코드:** `EXPENSE_EDIT_LOCK_INVALID`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXPENSE_EDIT_LOCK_INVALID:
                  summary: 만료됐거나 다른 수정 작업의 잠금
                  value:
                    code: EXPENSE_EDIT_LOCK_INVALID
                    message: 수정 가능 시간이 지났거나 다른 화면에서 수정을 시작했습니다. 다시 수정해주세요.
                    errors: null
    delete:
      tags:
      - Expense
      operationId: releaseExpenseEditLock
      summary: 지출 수정 잠금 해제
      description: |
        현재 수정 작업을 끝내고 잠금을 해제합니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자 중 지출을 기록한 회원이나 여행 관리자만 요청할 수 있으며, 요청한 회원이 획득한 잠금의 토큰을 보내야 합니다.

        ### 처리 조건
        요청한 회원의 잠금이고 토큰이 같으면 만료 여부와 관계없이 해제합니다. 해제는 지출의 수정 시각을 바꾸지 않습니다.

        ### 사용 시 주의
        이미 해제됐거나 만료돼 유효한 잠금이 없으면 같은 요청을 다시 보낸 것으로 보고 204로 응답합니다. 이전 수정 작업의 토큰으로 보낸 요청은 새 수정 작업의 잠금을 해제하지 않습니다.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "./expense.yml#/components/parameters/LockToken"
      responses:
        '204':
          description: 수정 잠금 해제 성공. 유효한 잠금이 이미 없을 때도 같습니다.
        '400':
          description: |
            X-Lock-Token이 없거나 UUID 형식이 아니거나, tripId나 expenseId가 숫자 ID가 아닙니다.

            **오류 코드:** `COMMON_INVALID_REQUEST`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_INVALID_REQUEST:
                  summary: 잠금 토큰이 없거나 형식이 올바르지 않음
                  value:
                    code: COMMON_INVALID_REQUEST
                    message: 요청이 올바르지 않습니다.
                    errors: null
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          description: |
            요청한 회원이 이 여행에 참여하지 않았거나 여행을 나갔거나, 지출 기록자도 여행 관리자도 아닙니다.

            **오류 코드:** `COMMON_FORBIDDEN`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_FORBIDDEN:
                  summary: 수정할 수 있는 참여자가 아님
                  value:
                    code: COMMON_FORBIDDEN
                    message: 요청을 수행할 권한이 없습니다.
                    errors: null
        '404':
          description: |
            tripId에 해당하는 여행이 없거나 삭제됐거나, expenseId에 해당하는 지출이 없거나 삭제됐거나 이 여행의 지출이 아닙니다.

            **오류 코드:** `COMMON_NOT_FOUND`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_NOT_FOUND:
                  summary: 여행이나 지출이 없거나 삭제됨
                  value:
                    code: COMMON_NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다.
                    errors: null
        '409':
          description: |
            다른 토큰이나 다른 회원의 만료되지 않은 잠금이 있습니다. 그 잠금은 그대로 둡니다.

            **오류 코드:** `EXPENSE_EDIT_LOCK_INVALID`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXPENSE_EDIT_LOCK_INVALID:
                  summary: 다른 수정 작업의 유효한 잠금
                  value:
                    code: EXPENSE_EDIT_LOCK_INVALID
                    message: 수정 가능 시간이 지났거나 다른 화면에서 수정을 시작했습니다. 다시 수정해주세요.
                    errors: null
  "/api/v1/trips/{tripId}/receipt-recognitions":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    post:
      tags:
      - Expense
      operationId: recognizeReceipt
      summary: 영수증 인식
      description: |
        영수증 이미지 한 장에서 지출 입력값을 읽어, 회원이 확인하고 고칠 인식 결과를 같은 요청의 응답으로 반환합니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자만 요청할 수 있습니다.

        ### 처리 조건
        확정된 여행에서만 요청할 수 있습니다. 인식만 하고 지출은 저장하지 않습니다.
        일부 값만 읽어도 읽은 값을 200으로 반환하며, 읽지 못한 값은 null, 읽은 품목이 없으면 items는 빈 배열입니다. 아무 값도 읽지 못해도 빈 결과를 200으로 반환합니다. 읽지 못한 값을 0이나 다른 값으로 채우지 않습니다.
        splitType이 EQUAL이면 items는 항상 빈 배열이고, 품목에 적힌 상품 할인은 discountAmount(전체 할인)에 더합니다. BY_ITEM이면 품목과 품목별 할인을 그대로 반환합니다.
        통화가 KRW, JPY, USD, EUR, CNY가 아니면 currency는 null입니다. 0 미만이거나 정수부가 10자리를 넘거나 소수점 이하가 2자리를 넘는 금액은 null입니다.
        카드번호, 카드 승인번호, 영수증 번호, 카드사, 가맹점 사업자번호, 주소와 전화번호는 응답에 넣지 않습니다.

        ### 사용 시 주의
        서버는 이미지를 저장하지 않고 외부 AI 인식 서비스(Gemini API)로 보낸 뒤 버립니다. 인식은 재시도하지 않으며, 외부 서비스 장애나 시간 초과는 빈 결과 대신 503으로 응답합니다.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: |
          image 파트에 영수증 이미지 한 장을, request 파트에 JSON을 보냅니다. 이미지는 JPEG, PNG, HEIC, WEBP 중 하나이며 최대 15 MiB(15,728,640바이트)이고, 요청 전체는 최대 16 MiB입니다. image 파트의 Content-Type과 파일 내용의 형식이 같아야 합니다.

          ```bash
          curl 'https://example.com/api/v1/trips/123/receipt-recognitions' \
            --header 'Authorization: Bearer {accessToken}' \
            --form 'image=@./receipt.jpg;type=image/jpeg' \
            --form 'request={"splitType":"BY_ITEM"};type=application/json'
          ```
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - image
              - request
              additionalProperties: false
              properties:
                image:
                  type: string
                  format: binary
                  description: 인식할 영수증 이미지 한 장입니다.
                request:
                  "$ref": "./expense.yml#/components/schemas/ReceiptRecognitionRequest"
            encoding:
              image:
                contentType: image/jpeg, image/png, image/heic, image/webp
              request:
                contentType: application/json
      responses:
        '200':
          description: 영수증 인식 성공. 일부나 전부를 읽지 못해도 같습니다.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./expense.yml#/components/schemas/RecognitionResult"
              examples:
                byItem:
                  summary: 품목별 인식 성공
                  value:
                    data:
                      name: Sushi Bar
                      paidDate: '2026-11-05'
                      currency: JPY
                      originalAmount: '1200.00'
                      discountAmount: null
                      items:
                      - name: Sushi
                        amount: '1000.00'
                        discountAmount: '100.00'
                      - name: Tea
                        amount: '200.00'
                        discountAmount: null
                equal:
                  summary: 전체 1/N 인식 성공
                  description: 품목의 상품 할인 100엔을 전체 할인에 더하고 품목은 반환하지 않습니다.
                  value:
                    data:
                      name: Sushi Bar
                      paidDate: '2026-11-05'
                      currency: JPY
                      originalAmount: '1200.00'
                      discountAmount: '100.00'
                      items: []
                emptyResult:
                  summary: 아무 값도 읽지 못함
                  value:
                    data:
                      name: null
                      paidDate: null
                      currency: null
                      originalAmount: null
                      discountAmount: null
                      items: []
        '400':
          description: |
            요청이 올바르지 않거나 이미지가 영수증이 아닙니다.

            | 오류 코드 | 발생 조건 |
            | --- | --- |
            | `COMMON_INVALID_REQUEST` | image나 request 파트가 없거나, request가 JSON 형식이 아니거나 splitType이 EQUAL, BY_ITEM이 아니거나 정의하지 않은 필드가 있습니다. |
            | `EXPENSE_NOT_RECEIPT` | 인식 서비스가 이미지를 영수증이 아니라고 판단했습니다. 영수증이지만 일부만 읽은 경우는 200입니다. |
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_INVALID_REQUEST:
                  summary: 파트가 없거나 request가 올바르지 않음
                  value:
                    code: COMMON_INVALID_REQUEST
                    message: 요청이 올바르지 않습니다.
                    errors: null
                EXPENSE_NOT_RECEIPT:
                  summary: 영수증이 아닌 이미지
                  value:
                    code: EXPENSE_NOT_RECEIPT
                    message: 영수증을 찾지 못했습니다. 영수증 사진을 다시 선택해주세요.
                    errors: null
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          description: |
            요청한 회원이 이 여행에 참여하지 않았거나 여행을 나갔습니다.

            **오류 코드:** `COMMON_FORBIDDEN`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_FORBIDDEN:
                  summary: 참여 중인 여행이 아님
                  value:
                    code: COMMON_FORBIDDEN
                    message: 요청을 수행할 권한이 없습니다.
                    errors: null
        '404':
          description: |
            tripId에 해당하는 여행이 없거나 삭제됐습니다.

            **오류 코드:** `COMMON_NOT_FOUND`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_NOT_FOUND:
                  summary: 여행이 없거나 삭제됨
                  value:
                    code: COMMON_NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다.
                    errors: null
        '409':
          description: |
            확정 전 여행입니다.

            **오류 코드:** `EXPENSE_TRIP_NOT_CONFIRMED`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXPENSE_TRIP_NOT_CONFIRMED:
                  summary: 여행이 확정 전임
                  value:
                    code: EXPENSE_TRIP_NOT_CONFIRMED
                    message: 여행을 확정한 뒤에 지출을 등록할 수 있습니다.
                    errors: null
        '413':
          description: |
            이미지가 15 MiB를 넘거나 요청 전체가 16 MiB를 넘습니다. 서버 앞단에서 먼저 거절하면 이 본문 없이 413이 올 수 있습니다.

            **오류 코드:** `EXPENSE_RECEIPT_TOO_LARGE`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXPENSE_RECEIPT_TOO_LARGE:
                  summary: 이미지가 너무 큼
                  value:
                    code: EXPENSE_RECEIPT_TOO_LARGE
                    message: 15MB 이하의 영수증 이미지를 선택해주세요.
                    errors: null
        '415':
          description: |
            요청이나 파트의 형식이 맞지 않습니다.

            | 오류 코드 | 발생 조건 |
            | --- | --- |
            | `EXPENSE_RECEIPT_UNSUPPORTED` | image 파트의 Content-Type이 JPEG, PNG, HEIC, WEBP가 아니거나, 파일 내용이 그 형식이 아니거나 비어 있습니다. |
            | `COMMON_UNSUPPORTED_MEDIA_TYPE` | 요청이 multipart/form-data가 아니거나 request 파트의 Content-Type이 application/json이 아닙니다. |
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXPENSE_RECEIPT_UNSUPPORTED:
                  summary: 지원하지 않는 이미지 형식
                  value:
                    code: EXPENSE_RECEIPT_UNSUPPORTED
                    message: JPG, PNG, HEIC, WEBP 형식의 영수증 이미지를 선택해주세요.
                    errors: null
                COMMON_UNSUPPORTED_MEDIA_TYPE:
                  summary: multipart 요청이 아님
                  value:
                    code: COMMON_UNSUPPORTED_MEDIA_TYPE
                    message: 지원하지 않는 미디어 타입입니다.
                    errors: null
        '503':
          description: |
            인식 기능이 꺼져 있거나, 외부 인식 서비스의 장애, 시간 초과, 오류 응답이나 해석할 수 없는 응답으로 인식을 마치지 못했습니다. 서버 앞단에서 동시 요청 수를 넘겨도 같은 본문으로 응답합니다.

            **오류 코드:** `EXPENSE_RECOGNITION_UNAVAILABLE`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXPENSE_RECOGNITION_UNAVAILABLE:
                  summary: 인식 서비스를 쓸 수 없음
                  value:
                    code: EXPENSE_RECOGNITION_UNAVAILABLE
                    message: 영수증 인식을 잠시 사용할 수 없습니다. 잠시 후 다시 시도해 주세요.
                    errors: null
components:
  parameters:
    ExpenseId:
      name: expenseId
      in: path
      required: true
      description: 지출 ID
      schema:
        "$ref": "../common/components.yml#/schemas/ResourceId"
    LockToken:
      name: X-Lock-Token
      in: header
      required: true
      description: 수정 잠금 획득 응답의 lockToken입니다. 같은 수정 작업의 연장, 해제와 지출 수정 요청에 보냅니다. 하이픈으로 구분한 8-4-4-4-12자리 16진수 표기만 받습니다.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        example: 5f0c7a2e-9b1d-4c3e-8a6f-2d4b6c8e0a1f
  schemas:
    ExpenseCurrency:
      type: string
      enum:
      - KRW
      - JPY
      - USD
      - EUR
      - CNY
      description: 결제 통화입니다. KRW와 JPY는 1, USD, EUR과 CNY는 0.01이 금액의 최소 단위입니다.
    PaymentMethod:
      type: string
      enum:
      - CARD
      - CASH
      - TRAVEL_CARD
      description: 결제 수단입니다. CARD는 일반 카드, CASH는 현금, TRAVEL_CARD는 트래블 카드입니다.
    RateSource:
      type: string
      enum:
      - AUTO
      - MANUAL
      description: 환율 결정 방식입니다. AUTO는 API에서 가져온 환율, MANUAL은 개인 기록이나 직접 입력한 환율입니다.
    ExpenseAmount:
      type: string
      pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
      description: 결제 통화 기준 금액입니다. 0 이상이고 정수부는 10자리까지인 소수점 이하 2자리 문자열이며, 통화의 최소 단위보다 작은 소수는 받지 않습니다. KRW와 JPY는 소수 부분이 .00이어야 합니다.
      example: '12000.00'
    ExpenseName:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '\S'
      description: 지출 목록과 상세에 표시할 지출명입니다. 공백이 아닌 문자를 하나 이상 포함해야 하며 공백을 지우지 않고 저장합니다.
      example: 식사
    ExpenseCreate:
      description: 지출 생성과 수정이 함께 쓰는 요청 본문입니다. 분배 방식(splitType)에 따라 부담자를 받습니다. 전체 1/N(EQUAL)이면 tripMemberIds만, 품목별(BY_ITEM)이면 items만 보냅니다. 다른 쪽을 함께 보내면 400입니다.
      oneOf:
      - "$ref": "./expense.yml#/components/schemas/EqualExpenseCreate"
      - "$ref": "./expense.yml#/components/schemas/ItemExpenseCreate"
      discriminator:
        propertyName: splitType
        mapping:
          EQUAL: "./expense.yml#/components/schemas/EqualExpenseCreate"
          BY_ITEM: "./expense.yml#/components/schemas/ItemExpenseCreate"
    EqualExpenseCreate:
      type: object
      description: 할인 전 총액에서 전체 할인을 뺀 최종 결제액을 선택한 부담자끼리 똑같이 나누는 지출 요청입니다. 지출 생성과 수정이 함께 씁니다.
      required:
      - name
      - splitType
      - currency
      - paidDate
      - paymentMethod
      - payerTripMemberId
      - originalAmount
      - exchangeRate
      - exchangeRateSource
      - tripMemberIds
      additionalProperties: false
      properties:
        name:
          "$ref": "./expense.yml#/components/schemas/ExpenseName"
        splitType:
          type: string
          enum:
          - EQUAL
          description: 전체 1/N을 나타내는 EQUAL입니다.
        currency:
          "$ref": "./expense.yml#/components/schemas/ExpenseCurrency"
        paidDate:
          type: string
          format: date
          description: 회원이 입력한 결제 당시의 현지 날짜입니다. UTC로 바꾸지 않습니다.
          example: '2026-11-05'
        paymentMethod:
          "$ref": "./expense.yml#/components/schemas/PaymentMethod"
        payerTripMemberId:
          allOf:
          - "$ref": "../common/components.yml#/schemas/ResourceId"
          description: 실제로 결제한 여행 참여자 ID입니다. 이 여행에 참여 중인 로그인 참여자만 지정할 수 있습니다. 지출 수정에서는 수정 전 지출의 결제자를 여행을 나갔거나 탈퇴했어도 그대로 둘 수 있습니다.
        originalAmount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 할인 전 총액입니다.
        discountAmount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 전체 할인액입니다. originalAmount보다 클 수 없습니다. 생략하면 할인이 없으며 null은 받지 않습니다.
          default: '0.00'
        exchangeRate:
          type: string
          pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
          description: 결제 통화 1단위의 원화 금액입니다. 0보다 크고 정수부는 10자리까지인 소수점 이하 2자리 문자열입니다. KRW 지출은 1.00이어야 합니다.
          example: '9.12'
        exchangeRateSource:
          "$ref": "./expense.yml#/components/schemas/RateSource"
        tripMemberIds:
          type: array
          description: 최종 결제액을 나눌 부담자의 여행 참여자 ID입니다. 1명 이상이고 겹칠 수 없으며, 이 여행에 참여 중인 로그인 참여자나 비로그인 참여자만 지정할 수 있습니다. 지출 수정에서는 수정 전 지출의 부담자를 여행을 나갔거나 탈퇴했어도 그대로 둘 수 있습니다.
          items:
            "$ref": "../common/components.yml#/schemas/ResourceId"
    ItemExpenseCreate:
      type: object
      description: 품목마다 지정한 부담자끼리 나누는 지출 요청입니다. 지출 생성과 수정이 함께 씁니다. 전체 할인은 품목별 부담 비율대로 나뉩니다.
      required:
      - name
      - splitType
      - currency
      - paidDate
      - paymentMethod
      - payerTripMemberId
      - originalAmount
      - exchangeRate
      - exchangeRateSource
      - items
      additionalProperties: false
      properties:
        name:
          "$ref": "./expense.yml#/components/schemas/ExpenseName"
        splitType:
          type: string
          enum:
          - BY_ITEM
          description: 품목별 분배를 나타내는 BY_ITEM입니다.
        currency:
          "$ref": "./expense.yml#/components/schemas/ExpenseCurrency"
        paidDate:
          type: string
          format: date
          description: 회원이 입력한 결제 당시의 현지 날짜입니다. UTC로 바꾸지 않습니다.
          example: '2026-11-06'
        paymentMethod:
          "$ref": "./expense.yml#/components/schemas/PaymentMethod"
        payerTripMemberId:
          allOf:
          - "$ref": "../common/components.yml#/schemas/ResourceId"
          description: 실제로 결제한 여행 참여자 ID입니다. 이 여행에 참여 중인 로그인 참여자만 지정할 수 있습니다. 지출 수정에서는 수정 전 지출의 결제자를 여행을 나갔거나 탈퇴했어도 그대로 둘 수 있습니다.
        originalAmount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 할인 전 총액입니다. 상품 할인 전 품목 금액의 합계와 같아야 합니다.
        discountAmount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 전체 할인액입니다. 상품 할인 합계와 더해 originalAmount보다 클 수 없습니다. 생략하면 할인이 없으며 null은 받지 않습니다.
          default: '0.00'
        exchangeRate:
          type: string
          pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
          description: 결제 통화 1단위의 원화 금액입니다. 0보다 크고 정수부는 10자리까지인 소수점 이하 2자리 문자열입니다. KRW 지출은 1.00이어야 합니다.
          example: '1380.55'
        exchangeRateSource:
          "$ref": "./expense.yml#/components/schemas/RateSource"
        items:
          type: array
          minItems: 1
          description: 품목 목록입니다. 보낸 순서대로 표시 순서(sortOrder)를 0부터 매깁니다.
          items:
            "$ref": "./expense.yml#/components/schemas/ExpenseItemCreate"
    ExpenseItemCreate:
      type: object
      required:
      - amount
      - discountAmount
      - tripMemberIds
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          maxLength: 50
          pattern: '\S'
          description: 품목명입니다. 공백이 아닌 문자를 하나 이상 포함해야 합니다. 생략하거나 null이면 이름 없는 품목입니다.
          example: 피자
        amount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 상품 할인 전 품목 금액입니다.
        discountAmount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 이 품목에만 적용하는 상품 할인액입니다. amount보다 클 수 없습니다.
        tripMemberIds:
          type: array
          description: 이 품목을 나눌 부담자의 여행 참여자 ID입니다. 1명 이상이고 겹칠 수 없으며, 이 여행에 참여 중인 로그인 참여자나 비로그인 참여자만 지정할 수 있습니다. 지출 수정에서는 수정 전 지출의 부담자를 여행을 나갔거나 탈퇴했어도 어느 품목에든 그대로 둘 수 있습니다.
          items:
            "$ref": "../common/components.yml#/schemas/ResourceId"
    ExpenseSummary:
      type: object
      description: 지출 목록에 표시할 지출의 요약입니다.
      required:
      - expenseId
      - name
      - paidDate
      - currency
      - amount
      - payerTripMemberId
      - settlementId
      - isEditLocked
      additionalProperties: false
      properties:
        expenseId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        name:
          type: string
          example: 식사
        paidDate:
          type: string
          format: date
          example: '2026-11-05'
        currency:
          "$ref": "./expense.yml#/components/schemas/ExpenseCurrency"
        amount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 상품 할인과 전체 할인을 뺀 최종 결제액입니다.
        payerTripMemberId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        settlementId:
          type: string
          nullable: true
          description: 이 지출을 정산 대상으로 잠근 정산 ID입니다. 연결된 정산이 없으면 null입니다.
        isEditLocked:
          type: boolean
          description: 응답 시점에 만료되지 않은 수정 잠금이 있는지입니다.
    ExpenseDetail:
      type: object
      description: 지출의 결제 정보, 품목, 참여자별 최종 부담액과 저장한 환율입니다. 금액은 모두 소수점 이하 2자리 문자열입니다.
      required:
      - expenseId
      - name
      - paidDate
      - currency
      - amount
      - payerTripMemberId
      - settlementId
      - isEditLocked
      - tripId
      - splitType
      - createdByTripMemberId
      - paymentMethod
      - originalAmount
      - discountAmount
      - exchangeRate
      - exchangeRateSource
      - exchangeRateProvider
      - exchangeRateBaseDate
      - amountKrw
      - items
      - shares
      additionalProperties: false
      properties:
        expenseId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        name:
          type: string
          example: 식사
        paidDate:
          type: string
          format: date
          example: '2026-11-05'
        currency:
          "$ref": "./expense.yml#/components/schemas/ExpenseCurrency"
        amount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 상품 할인과 전체 할인을 뺀 최종 결제액입니다.
        payerTripMemberId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        settlementId:
          type: string
          nullable: true
          description: 이 지출을 정산 대상으로 잠근 정산 ID입니다. 연결된 정산이 없으면 null입니다.
        isEditLocked:
          type: boolean
          description: 응답 시점에 만료되지 않은 수정 잠금이 있는지입니다.
        tripId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        splitType:
          type: string
          enum:
          - EQUAL
          - BY_ITEM
          description: 분배 방식입니다. EQUAL은 전체 1/N, BY_ITEM은 품목별 분배입니다.
        createdByTripMemberId:
          allOf:
          - "$ref": "../common/components.yml#/schemas/ResourceId"
          description: 지출을 등록한 회원의 여행 참여자 ID입니다. 결제자와 다를 수 있습니다.
        paymentMethod:
          "$ref": "./expense.yml#/components/schemas/PaymentMethod"
        originalAmount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 할인 전 총액입니다.
        discountAmount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 전체 할인액입니다.
        exchangeRate:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 지출에 적용한 결제 통화 1단위의 원화 금액입니다.
        exchangeRateSource:
          "$ref": "./expense.yml#/components/schemas/RateSource"
        exchangeRateProvider:
          type: string
          nullable: true
          description: 환율 제공 기관입니다. 저장하지 않으므로 null입니다.
        exchangeRateBaseDate:
          type: string
          format: date
          nullable: true
          description: 환율 기준일입니다. 저장하지 않으므로 null입니다.
        amountKrw:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 최종 결제액의 원화 환산액입니다. 1원 단위라 소수 부분은 .00입니다.
        items:
          type: array
          description: 품목을 표시 순서대로 담습니다. 전체 1/N 지출이면 빈 배열입니다.
          items:
            "$ref": "./expense.yml#/components/schemas/ExpenseItem"
        shares:
          type: array
          description: 참여자별 최종 부담액을 여행 참여자 ID 순서대로 담습니다. 부담액 합계는 amount, 원화 부담액 합계는 amountKrw와 같습니다.
          items:
            "$ref": "./expense.yml#/components/schemas/Share"
    ExpenseItem:
      type: object
      required:
      - expenseItemId
      - name
      - amount
      - discountAmount
      - sortOrder
      - tripMemberIds
      additionalProperties: false
      properties:
        expenseItemId:
          allOf:
          - "$ref": "../common/components.yml#/schemas/ResourceId"
          description: 지출 품목 ID입니다. 지출을 수정하면 품목을 다시 저장하므로 수정할 때마다 바뀝니다.
        name:
          type: string
          nullable: true
          description: 품목명입니다. 이름 없는 품목이면 null입니다.
          example: 피자
        amount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 상품 할인 전 품목 금액입니다.
        discountAmount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 이 품목의 상품 할인액입니다.
        sortOrder:
          type: integer
          minimum: 0
          description: 0부터 시작하는 표시 순서입니다.
          example: 0
        tripMemberIds:
          type: array
          description: 이 품목을 나누는 부담자의 여행 참여자 ID를 ID 순서대로 담습니다.
          items:
            "$ref": "../common/components.yml#/schemas/ResourceId"
    Share:
      type: object
      required:
      - tripMemberId
      - amount
      - amountKrw
      additionalProperties: false
      properties:
        tripMemberId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        amount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 결제 통화 기준 최종 부담액입니다.
        amountKrw:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 원화로 환산한 최종 부담액입니다. 1원 단위라 소수 부분은 .00입니다.
    EditLock:
      type: object
      description: 새로 발급한 수정 잠금입니다.
      required:
      - lockToken
      - expiresAt
      additionalProperties: false
      properties:
        lockToken:
          type: string
          format: uuid
          description: 이 수정 작업의 잠금 토큰입니다. 지출 수정, 잠금 연장과 해제 요청의 X-Lock-Token으로 보냅니다.
          example: 5f0c7a2e-9b1d-4c3e-8a6f-2d4b6c8e0a1f
        expiresAt:
          type: string
          format: date-time
          description: 잠금 만료 시각(UTC)입니다. 이 시각부터 잠금은 유효하지 않습니다.
          example: '2026-11-05T03:05:00Z'
    LockExpiry:
      type: object
      description: 연장한 수정 잠금의 만료 시각입니다.
      required:
      - expiresAt
      additionalProperties: false
      properties:
        expiresAt:
          type: string
          format: date-time
          description: 기존 만료 시각에 2분을 더한 잠금 만료 시각(UTC)입니다. 이 시각부터 잠금은 유효하지 않습니다.
          example: '2026-11-05T03:07:00Z'
    ReceiptRecognitionRequest:
      type: object
      description: 영수증 인식 요청의 JSON 파트입니다.
      required:
      - splitType
      additionalProperties: false
      properties:
        splitType:
          type: string
          enum:
          - EQUAL
          - BY_ITEM
          description: 인식 결과를 채울 지출 입력의 분배 방식입니다. EQUAL은 전체 1/N, BY_ITEM은 품목별 분배입니다.
          example: BY_ITEM
    RecognitionResult:
      type: object
      description: 영수증에서 읽은 지출 입력값입니다. 회원이 확인하고 고치기 전의 값입니다.
      required:
      - name
      - paidDate
      - currency
      - originalAmount
      - discountAmount
      - items
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          description: 지출명으로 쓸 가맹점 이름입니다. 읽지 못하면 null입니다. 지출명 최대 길이(50자)를 넘을 수 있습니다.
          example: Sushi Bar
        paidDate:
          type: string
          format: date
          nullable: true
          description: 영수증의 결제 날짜입니다. 시각은 반환하지 않으며 읽지 못하면 null입니다.
          example: '2026-11-05'
        currency:
          type: string
          nullable: true
          enum:
          - KRW
          - JPY
          - USD
          - EUR
          - CNY
          - null
          description: 결제 통화입니다. 읽지 못했거나 KRW, JPY, USD, EUR, CNY가 아니면 null입니다.
          example: JPY
        originalAmount:
          type: string
          nullable: true
          pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
          description: 할인 전 결제 총액입니다. 읽지 못하면 null입니다.
          example: '1200.00'
        discountAmount:
          type: string
          nullable: true
          pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'

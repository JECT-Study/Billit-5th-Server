    put:
      tags:
      - Expense
      operationId: updateExpense
      summary: 지출 수정
      description: |
        수정 잠금을 가진 회원이 지출의 결제 정보와 부담자를 요청한 입력 전체로 바꾸고, 서버가 다시 계산한 참여자별 최종 부담액과 원화 환산액을 함께 저장합니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자 중 지출을 기록한 회원이나 여행 관리자만 요청할 수 있으며, 요청한 회원이 획득한 잠금의 토큰을 보내야 합니다. 결제자라는 이유만으로는 요청할 수 없습니다.

        ### 처리 조건
        요청한 회원의 수정 잠금이 만료되기 전이고 정산에 포함되지 않은 지출만 수정할 수 있습니다.
        수정할 수 있는 입력 전체를 보내며, 생략한 필드를 기존 값으로 두지 않습니다. 금액 검증과 부담액 계산은 지출 생성과 같습니다.
        결제자와 부담자의 조건도 지출 생성과 같습니다. 다만 수정 전 지출의 결제자와 부담자는 여행을 나갔거나 탈퇴했어도 그대로 둘 수 있습니다.
        수정에 성공하면 지출, 품목과 부담액의 변경과 수정 잠금 해제를 한 번에 반영하고 지출의 수정 시각을 바꿉니다. 실패하면 기존 지출과 수정 잠금을 그대로 둡니다. 기록자(createdByTripMemberId)는 바뀌지 않습니다.

        ### 사용 시 주의
        품목은 모두 지우고 요청한 순서대로 다시 저장하므로 expenseItemId는 수정할 때마다 바뀝니다.
        수정에 성공하면 잠금이 풀리므로, 응답을 받지 못해 같은 토큰으로 다시 보낸 요청은 409 EXPENSE_EDIT_LOCK_INVALID로 거절합니다. 앱은 지출 상세를 다시 조회해 수정이 반영됐는지 확인합니다.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "./expense.yml#/components/parameters/LockToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "./expense.yml#/components/schemas/ExpenseCreate"
            examples:
              equal:
                summary: 전체 1/N 지출로 수정

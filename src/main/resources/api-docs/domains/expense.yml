paths:
  "/api/v1/trips/{tripId}/expenses":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    post:
      tags:
      - Expense
      operationId: createExpense
      summary: 지출 생성
      description: |
        결제 정보와 부담자를 입력한 지출을 저장하고, 서버가 계산한 참여자별 최종 부담액과 원화 환산액을 함께 저장합니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자만 요청할 수 있습니다. 요청한 회원이 지출의 기록자(createdByTripMemberId)가 됩니다.

        ### 처리 조건
        확정된 여행에서만 등록할 수 있습니다. 결제자는 이 여행에 참여 중인 로그인 참여자여야 하고, 부담자는 참여 중인 로그인 참여자나 비로그인 참여자여야 합니다.
        최종 결제액(amount)은 전체 1/N이면 originalAmount - discountAmount, 품목별이면 originalAmount - 상품 할인 합계 - discountAmount이며 0 이상이어야 합니다. 품목별이면 상품 할인 전 품목 금액의 합계가 originalAmount와 같아야 합니다.
        참여자별 부담액은 최종 결제액을 부담 비율대로 나눈 값입니다. 부담 비율은 품목마다 상품 할인 뒤 금액을 그 품목의 부담자에게 똑같이 나눈 합이고, 전체 1/N이면 모두 같습니다. 전체 할인도 이 비율로 나뉩니다.
        부담액은 통화의 최소 단위(KRW, JPY는 1, USD, EUR, CNY는 0.01)로 내린 뒤, 남은 단위를 소수점 이하가 큰 참여자부터, 같으면 여행 참여자 ID가 작은 참여자부터 하나씩 배정합니다.
        원화 환산액(amountKrw)은 최종 결제액에 환율을 곱해 1원 단위로 반올림(HALF_UP)합니다. 참여자별 원화 부담액은 원화 환산액을 부담액 비율대로 같은 방식으로 나눠 합계를 맞춥니다.

        ### 사용 시 주의
        앱은 저장 시도마다 Idempotency-Key에 새 UUID를 보내고, 응답을 받지 못해 같은 저장을 다시 보낼 때만 같은 키를 사용합니다.
        같은 회원이 같은 여행에서 같은 키로 다시 보내면 새 지출을 만들지 않고 처음 만든 지출의 현재 상세를 처음과 같이 201로 반환합니다. 요청 본문은 처음 요청과 비교하지 않습니다.
        같은 키의 요청이 동시에 와도 지출은 하나만 저장하고, 모든 요청이 그 지출을 받습니다.
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 지출 생성 요청의 고유키입니다. 앱이 저장 시도마다 UUID로 만들고, 같은 저장을 다시 보낼 때만 같은 값을 사용합니다. 키는 지출 생성에만 쓰며 지출 생성 키끼리 한 번만 사용할 수 있습니다. 만료되지 않고 만든 지출과 함께 보관합니다. 하이픈으로 구분한 8-4-4-4-12자리 16진수 표기만 받습니다.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          example: 8b2e4c1a-3f5d-4a6b-9c7e-1d2f3a4b5c6d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "./expense.yml#/components/schemas/ExpenseCreate"
            examples:
              equal:
                summary: 전체 1/N 지출 생성
                value:
                  name: 식사
                  splitType: EQUAL
                  currency: KRW
                  paidDate: '2026-11-05'
                  paymentMethod: CARD
                  payerTripMemberId: '201'
                  originalAmount: '12000.00'
                  discountAmount: '0.00'
                  exchangeRate: '1.00'
                  exchangeRateSource: MANUAL
                  tripMemberIds:
                  - '201'
                  - '202'
              byItem:
                summary: 품목별 지출 생성
                value:
                  name: Dinner
                  splitType: BY_ITEM
                  currency: USD
                  paidDate: '2026-11-06'
                  paymentMethod: TRAVEL_CARD
                  payerTripMemberId: '201'
                  originalAmount: '12.34'
                  discountAmount: '0.34'
                  exchangeRate: '1380.55'
                  exchangeRateSource: AUTO
                  items:
                  - name: 피자
                    amount: '10.00'
                    discountAmount: '1.00'
                    tripMemberIds:
                    - '201'
                    - '202'
                  - amount: '2.34'
                    discountAmount: '0.00'
                    tripMemberIds:
                    - '201'
      responses:
        '201':
          description: 지출 생성 성공. 같은 회원이 같은 키로 다시 요청해도 처음 만든 지출을 반환합니다.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./expense.yml#/components/schemas/ExpenseDetail"
              examples:
                equal:
                  summary: 전체 1/N 지출 생성 성공
                  value:
                    data:
                      expenseId: '501'
                      name: 식사
                      paidDate: '2026-11-05'
                      currency: KRW
                      amount: '12000.00'
                      payerTripMemberId: '201'
                      settlementId: null
                      isEditLocked: false
                      tripId: '123'
                      splitType: EQUAL
                      createdByTripMemberId: '201'
                      paymentMethod: CARD
                      originalAmount: '12000.00'
                      discountAmount: '0.00'
                      exchangeRate: '1.00'
                      exchangeRateSource: MANUAL
                      exchangeRateProvider: null
                      exchangeRateBaseDate: null
                      amountKrw: '12000.00'
                      items: []
                      shares:
                      - tripMemberId: '201'
                        amount: '6000.00'
                        amountKrw: '6000.00'
                      - tripMemberId: '202'
                        amount: '6000.00'
                        amountKrw: '6000.00'
                byItem:
                  summary: 품목별 지출 생성 성공
                  description: 최종 결제액 11.00달러를 13.68 대 9.00 비율로 나눕니다. 남은 1센트는 소수점 이하가 더 큰 202에게 배정합니다.
                  value:
                    data:
                      expenseId: '502'
                      name: Dinner
                      paidDate: '2026-11-06'
                      currency: USD
                      amount: '11.00'
                      payerTripMemberId: '201'
                      settlementId: null
                      isEditLocked: false
                      tripId: '123'
                      splitType: BY_ITEM
                      createdByTripMemberId: '201'
                      paymentMethod: TRAVEL_CARD
                      originalAmount: '12.34'
                      discountAmount: '0.34'
                      exchangeRate: '1380.55'
                      exchangeRateSource: AUTO
                      exchangeRateProvider: null
                      exchangeRateBaseDate: null
                      amountKrw: '15186.00'
                      items:
                      - expenseItemId: '701'
                        name: 피자
                        amount: '10.00'
                        discountAmount: '1.00'
                        sortOrder: 0
                        tripMemberIds:
                        - '201'
                        - '202'
                      - expenseItemId: '702'
                        name: null
                        amount: '2.34'
                        discountAmount: '0.00'
                        sortOrder: 1
                        tripMemberIds:
                        - '201'
                      shares:
                      - tripMemberId: '201'
                        amount: '6.63'
                        amountKrw: '9153.00'
                      - tripMemberId: '202'
                        amount: '4.37'
                        amountKrw: '6033.00'
        '400':
          description: |
            요청 형식이나 값이 올바르지 않거나, 부담자와 금액이 지출 등록 조건에 맞지 않습니다.

            | 오류 코드 | 발생 조건 |
            | --- | --- |
            | `COMMON_INVALID_REQUEST` | Idempotency-Key가 없거나 형식이 올바르지 않거나, 요청 본문이 필드 형식과 범위를 벗어났습니다. 분배 방식에 맞지 않는 tripMemberIds나 items, 통화의 최소 단위보다 작은 소수, KRW 지출의 1.00이 아닌 환율, 상품 할인이 품목 금액보다 큰 품목, 0 미만인 최종 결제액과 정수부가 10자리를 넘는 원화 환산액도 포함합니다. |
            | `EXPENSE_INVALID_SHARES` | 결제자가 이 여행에 참여 중인 로그인 참여자가 아니거나, 부담자가 없거나 겹치거나 이 여행에 참여 중인 로그인 참여자나 비로그인 참여자가 아닙니다. |
            | `EXPENSE_AMOUNT_MISMATCH` | 품목별 지출에서 상품 할인 전 품목 금액의 합계가 originalAmount와 다릅니다. |
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_INVALID_REQUEST:
                  summary: 고유키나 요청 본문이 올바르지 않음
                  value:
                    code: COMMON_INVALID_REQUEST
                    message: 요청이 올바르지 않습니다.
                    errors: null
                EXPENSE_INVALID_SHARES:
                  summary: 결제자나 부담자로 지정할 수 없는 참여자
                  value:
                    code: EXPENSE_INVALID_SHARES
                    message: 결제자나 부담자로 지정할 수 없는 참여자가 있습니다.
                    errors: null
                EXPENSE_AMOUNT_MISMATCH:
                  summary: 품목 금액 합계가 총액과 다름
                  value:
                    code: EXPENSE_AMOUNT_MISMATCH
                    message: 품목 금액의 합계가 결제 총액과 다릅니다.
                    errors: null
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          description: |
            요청한 회원이 이 여행에 참여하지 않았거나 여행을 나갔습니다.

            **오류 코드:** `COMMON_FORBIDDEN`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_FORBIDDEN:
                  summary: 참여 중인 여행이 아님
                  value:
                    code: COMMON_FORBIDDEN
                    message: 요청을 수행할 권한이 없습니다.
                    errors: null
        '404':
          description: |
            tripId에 해당하는 여행이 없거나 삭제됐습니다.

            **오류 코드:** `COMMON_NOT_FOUND`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_NOT_FOUND:
                  summary: 여행이 없거나 삭제됨
                  value:
                    code: COMMON_NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다.
                    errors: null
        '409':
          description: |
            지출 등록 요청이 여행이나 고유키의 현재 상태와 충돌합니다.

            | 오류 코드 | 발생 조건 |
            | --- | --- |
            | `EXPENSE_TRIP_NOT_CONFIRMED` | 확정 전 여행입니다. |
            | `EXPENSE_IDEMPOTENCY_KEY_REUSED` | 다른 회원이나 다른 여행에서 이미 사용한 Idempotency-Key이거나, 그 키로 만든 지출이 삭제됐습니다. 기존 지출 정보는 반환하지 않습니다. |
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXPENSE_TRIP_NOT_CONFIRMED:
                  summary: 여행이 확정 전임
                  value:
                    code: EXPENSE_TRIP_NOT_CONFIRMED
                    message: 여행을 확정한 뒤에 지출을 등록할 수 있습니다.
                    errors: null
                EXPENSE_IDEMPOTENCY_KEY_REUSED:
                  summary: 다른 요청에서 사용했거나 삭제된 지출의 고유키
                  value:
                    code: EXPENSE_IDEMPOTENCY_KEY_REUSED
                    message: 이미 사용된 지출 등록 요청입니다. 다시 시도해주세요.
                    errors: null
components:
  schemas:
    ExpenseCurrency:
      type: string
      enum:
      - KRW
      - JPY
      - USD
      - EUR
      - CNY
      description: 결제 통화입니다. KRW와 JPY는 1, USD, EUR과 CNY는 0.01이 금액의 최소 단위입니다.
    PaymentMethod:
      type: string
      enum:
      - CARD
      - CASH
      - TRAVEL_CARD
      description: 결제 수단입니다. CARD는 일반 카드, CASH는 현금, TRAVEL_CARD는 트래블 카드입니다.
    RateSource:
      type: string
      enum:
      - AUTO
      - MANUAL
      description: 환율 결정 방식입니다. AUTO는 API에서 가져온 환율, MANUAL은 개인 기록이나 직접 입력한 환율입니다.
    ExpenseAmount:
      type: string
      pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
      description: 결제 통화 기준 금액입니다. 0 이상이고 정수부는 10자리까지인 소수점 이하 2자리 문자열이며, 통화의 최소 단위보다 작은 소수는 받지 않습니다. KRW와 JPY는 소수 부분이 .00이어야 합니다.
      example: '12000.00'
    ExpenseName:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '\S'
      description: 지출 목록과 상세에 표시할 지출명입니다. 공백이 아닌 문자를 하나 이상 포함해야 하며 공백을 지우지 않고 저장합니다.
      example: 식사
    ExpenseCreate:
      description: 분배 방식(splitType)에 따라 부담자를 받습니다. 전체 1/N(EQUAL)이면 tripMemberIds만, 품목별(BY_ITEM)이면 items만 보냅니다. 다른 쪽을 함께 보내면 400입니다.
      oneOf:
      - "$ref": "./expense.yml#/components/schemas/EqualExpenseCreate"
      - "$ref": "./expense.yml#/components/schemas/ItemExpenseCreate"
      discriminator:
        propertyName: splitType
        mapping:
          EQUAL: "./expense.yml#/components/schemas/EqualExpenseCreate"
          BY_ITEM: "./expense.yml#/components/schemas/ItemExpenseCreate"
    EqualExpenseCreate:
      type: object
      description: 할인 전 총액에서 전체 할인을 뺀 최종 결제액을 선택한 부담자끼리 똑같이 나누는 지출 생성 요청입니다.
      required:
      - name
      - splitType
      - currency
      - paidDate
      - paymentMethod
      - payerTripMemberId
      - originalAmount
      - exchangeRate
      - exchangeRateSource
      - tripMemberIds
      additionalProperties: false
      properties:
        name:
          "$ref": "./expense.yml#/components/schemas/ExpenseName"
        splitType:
          type: string
          enum:
          - EQUAL
          description: 전체 1/N을 나타내는 EQUAL입니다.
        currency:
          "$ref": "./expense.yml#/components/schemas/ExpenseCurrency"
        paidDate:
          type: string
          format: date
          description: 회원이 입력한 결제 당시의 현지 날짜입니다. UTC로 바꾸지 않습니다.
          example: '2026-11-05'
        paymentMethod:
          "$ref": "./expense.yml#/components/schemas/PaymentMethod"
        payerTripMemberId:
          allOf:
          - "$ref": "../common/components.yml#/schemas/ResourceId"
          description: 실제로 결제한 여행 참여자 ID입니다. 이 여행에 참여 중인 로그인 참여자만 지정할 수 있습니다.
        originalAmount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 할인 전 총액입니다.
        discountAmount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 전체 할인액입니다. originalAmount보다 클 수 없습니다. 생략하면 할인이 없으며 null은 받지 않습니다.
          default: '0.00'
        exchangeRate:
          type: string
          pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
          description: 결제 통화 1단위의 원화 금액입니다. 0보다 크고 정수부는 10자리까지인 소수점 이하 2자리 문자열입니다. KRW 지출은 1.00이어야 합니다.
          example: '9.12'
        exchangeRateSource:
          "$ref": "./expense.yml#/components/schemas/RateSource"
        tripMemberIds:
          type: array
          description: 최종 결제액을 나눌 부담자의 여행 참여자 ID입니다. 1명 이상이고 겹칠 수 없으며, 이 여행에 참여 중인 로그인 참여자나 비로그인 참여자만 지정할 수 있습니다.
          items:
            "$ref": "../common/components.yml#/schemas/ResourceId"
    ItemExpenseCreate:
      type: object
      description: 품목마다 지정한 부담자끼리 나누는 지출 생성 요청입니다. 전체 할인은 품목별 부담 비율대로 나뉩니다.
      required:
      - name
      - splitType
      - currency
      - paidDate
      - paymentMethod
      - payerTripMemberId
      - originalAmount
      - exchangeRate
      - exchangeRateSource
      - items
      additionalProperties: false
      properties:
        name:
          "$ref": "./expense.yml#/components/schemas/ExpenseName"
        splitType:
          type: string
          enum:
          - BY_ITEM
          description: 품목별 분배를 나타내는 BY_ITEM입니다.
        currency:
          "$ref": "./expense.yml#/components/schemas/ExpenseCurrency"
        paidDate:
          type: string
          format: date
          description: 회원이 입력한 결제 당시의 현지 날짜입니다. UTC로 바꾸지 않습니다.
          example: '2026-11-06'
        paymentMethod:
          "$ref": "./expense.yml#/components/schemas/PaymentMethod"
        payerTripMemberId:
          allOf:
          - "$ref": "../common/components.yml#/schemas/ResourceId"
          description: 실제로 결제한 여행 참여자 ID입니다. 이 여행에 참여 중인 로그인 참여자만 지정할 수 있습니다.
        originalAmount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 할인 전 총액입니다. 상품 할인 전 품목 금액의 합계와 같아야 합니다.
        discountAmount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 전체 할인액입니다. 상품 할인 합계와 더해 originalAmount보다 클 수 없습니다. 생략하면 할인이 없으며 null은 받지 않습니다.
          default: '0.00'
        exchangeRate:
          type: string
          pattern: '^(0|[1-9][0-9]{0,9})\.[0-9]{2}$'
          description: 결제 통화 1단위의 원화 금액입니다. 0보다 크고 정수부는 10자리까지인 소수점 이하 2자리 문자열입니다. KRW 지출은 1.00이어야 합니다.
          example: '1380.55'
        exchangeRateSource:
          "$ref": "./expense.yml#/components/schemas/RateSource"
        items:
          type: array
          minItems: 1
          description: 품목 목록입니다. 보낸 순서대로 표시 순서(sortOrder)를 0부터 매깁니다.
          items:
            "$ref": "./expense.yml#/components/schemas/ExpenseItemCreate"
    ExpenseItemCreate:
      type: object
      required:
      - amount
      - discountAmount
      - tripMemberIds
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          maxLength: 50
          pattern: '\S'
          description: 품목명입니다. 공백이 아닌 문자를 하나 이상 포함해야 합니다. 생략하거나 null이면 이름 없는 품목입니다.
          example: 피자
        amount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 상품 할인 전 품목 금액입니다.
        discountAmount:
          allOf:
          - "$ref": "./expense.yml#/components/schemas/ExpenseAmount"
          description: 이 품목에만 적용하는 상품 할인액입니다. amount보다 클 수 없습니다.
        tripMemberIds:
          type: array
          description: 이 품목을 나눌 부담자의 여행 참여자 ID입니다. 1명 이상이고 겹칠 수 없으며, 이 여행에 참여 중인 로그인 참여자나 비로그인 참여자만 지정할 수 있습니다.
          items:
            "$ref": "../common/components.yml#/schemas/ResourceId"
    ExpenseDetail:
      type: object
      description: 지출의 결제 정보, 품목, 참여자별 최종 부담액과 저장한 환율입니다. 금액은 모두 소수점 이하 2자리 문자열입니다.
      required:
      - expenseId
      - name
      - paidDate
      - currency
      - amount
      - payerTripMemberId
      - settlementId
      - isEditLocked
      - tripId
      - splitType
      - createdByTripMemberId
      - paymentMethod
      - originalAmount
      - discountAmount
      - exchangeRate
      - exchangeRateSource
      - exchangeRateProvider
      - exchangeRateBaseDate
      - amountKrw
      - items
      - shares
      additionalProperties: false
      properties:
        expenseId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        name:
          type: string
          example: 식사
        paidDate:
          type: string
          format: date
          example: '2026-11-05'
        currency:
          "$ref": "./expense.yml#/components/schemas/ExpenseCurrency"
        amount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 상품 할인과 전체 할인을 뺀 최종 결제액입니다.
        payerTripMemberId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        settlementId:
          type: string
          nullable: true
          description: 이 지출을 정산 대상으로 잠근 정산 ID입니다. 연결된 정산이 없으면 null입니다.
        isEditLocked:
          type: boolean
          description: 응답 시점에 만료되지 않은 수정 잠금이 있는지입니다.
        tripId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        splitType:
          type: string
          enum:
          - EQUAL
          - BY_ITEM
          description: 분배 방식입니다. EQUAL은 전체 1/N, BY_ITEM은 품목별 분배입니다.
        createdByTripMemberId:
          allOf:
          - "$ref": "../common/components.yml#/schemas/ResourceId"
          description: 지출을 등록한 회원의 여행 참여자 ID입니다. 결제자와 다를 수 있습니다.
        paymentMethod:
          "$ref": "./expense.yml#/components/schemas/PaymentMethod"
        originalAmount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 할인 전 총액입니다.
        discountAmount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 전체 할인액입니다.
        exchangeRate:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 지출에 적용한 결제 통화 1단위의 원화 금액입니다.
        exchangeRateSource:
          "$ref": "./expense.yml#/components/schemas/RateSource"
        exchangeRateProvider:
          type: string
          nullable: true
          description: 환율 제공 기관입니다. 저장하지 않으므로 null입니다.
        exchangeRateBaseDate:
          type: string
          format: date
          nullable: true
          description: 환율 기준일입니다. 저장하지 않으므로 null입니다.
        amountKrw:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 최종 결제액의 원화 환산액입니다. 1원 단위라 소수 부분은 .00입니다.
        items:
          type: array
          description: 품목을 표시 순서대로 담습니다. 전체 1/N 지출이면 빈 배열입니다.
          items:
            "$ref": "./expense.yml#/components/schemas/ExpenseItem"
        shares:
          type: array
          description: 참여자별 최종 부담액을 여행 참여자 ID 순서대로 담습니다. 부담액 합계는 amount, 원화 부담액 합계는 amountKrw와 같습니다.
          items:
            "$ref": "./expense.yml#/components/schemas/Share"
    ExpenseItem:
      type: object
      required:
      - expenseItemId
      - name
      - amount
      - discountAmount
      - sortOrder
      - tripMemberIds
      additionalProperties: false
      properties:
        expenseItemId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        name:
          type: string
          nullable: true
          description: 품목명입니다. 이름 없는 품목이면 null입니다.
          example: 피자
        amount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 상품 할인 전 품목 금액입니다.
        discountAmount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 이 품목의 상품 할인액입니다.
        sortOrder:
          type: integer
          minimum: 0
          description: 0부터 시작하는 표시 순서입니다.
          example: 0
        tripMemberIds:
          type: array
          description: 이 품목을 나누는 부담자의 여행 참여자 ID를 ID 순서대로 담습니다.
          items:
            "$ref": "../common/components.yml#/schemas/ResourceId"
    Share:
      type: object
      required:
      - tripMemberId
      - amount
      - amountKrw
      additionalProperties: false
      properties:
        tripMemberId:
          "$ref": "../common/components.yml#/schemas/ResourceId"
        amount:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 결제 통화 기준 최종 부담액입니다.
        amountKrw:
          allOf:
          - "$ref": "../common/components.yml#/schemas/DecimalString"
          description: 원화로 환산한 최종 부담액입니다. 1원 단위라 소수 부분은 .00입니다.

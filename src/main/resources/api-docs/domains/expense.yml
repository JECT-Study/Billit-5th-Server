                    errors: null
        '409':
          description: |
            지출이 정산이나 다른 수정 작업으로 잠겨 있습니다.

            | 오류 코드 | 발생 조건 |
            | --- | --- |
            | `EXPENSE_SETTLEMENT_LOCKED` | 지출이 준비 중이거나 발행된 정산에 포함돼 있습니다. |
            | `EXPENSE_EDIT_LOCKED` | 만료되지 않은 수정 잠금이 있습니다. 요청한 회원의 잠금이어도 같습니다. |
          content:

paths:
  "/api/v1/trips/{tripId}/expenses":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    get:
      tags:
      - Expense
      operationId: listExpenses
      summary: 지출 목록 조회
      description: |
        이 여행의 지출을 페이지 단위로 조회합니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자만 요청할 수 있습니다.

        ### 처리 조건
        삭제된 지출은 포함하지 않고, 여행 기간 밖의 지출도 포함합니다. 결제 날짜(paidDate)가 늦은 지출부터 정렬하며 결제 날짜가 같으면 지출 ID가 큰 지출을 먼저 둡니다. fromDate와 toDate를 보내면 결제 날짜가 그 범위에 드는 지출만 조회하고, 필터를 적용한 결과에 페이지를 나눕니다.
        확정 전 여행은 지출을 등록할 수 없으므로 빈 목록입니다.
      security:
      - bearerAuth: []
      parameters:
      - "$ref": "../common/components.yml#/parameters/Page"
      - "$ref": "../common/components.yml#/parameters/Size"
      - name: fromDate
        in: query
        required: false
        description: '조회할 결제 날짜의 시작입니다. 이 날짜의 지출도 포함합니다. YYYY-MM-DD 형식만 받고 없는 날짜는 거절합니다. toDate보다 뒤일 수 없습니다. 생략하면 시작 경계를 두지 않습니다. 예: fromDate=2026-11-05'
        schema:
          type: string
          format: date
          example: '2026-11-05'
      - name: toDate
        in: query
        required: false
        description: '조회할 결제 날짜의 끝입니다. 이 날짜의 지출도 포함합니다. YYYY-MM-DD 형식만 받고 없는 날짜는 거절합니다. 생략하면 끝 경계를 두지 않습니다. 예: toDate=2026-11-07'
        schema:
          type: string
          format: date
          example: '2026-11-07'
      responses:
        '200':
          description: 지출 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - page
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: 조건에 맞는 지출이 없거나 마지막 페이지를 넘으면 빈 목록입니다.
                    items:
                      "$ref": "./expense.yml#/components/schemas/ExpenseSummary"
                  page:
                    "$ref": "../common/components.yml#/schemas/PageInfo"
              examples:
                success:
                  summary: 지출 목록 조회 성공
                  value:
                    data:
                    - expenseId: '502'
                      name: Dinner
                      paidDate: '2026-11-06'
                      currency: USD
                      amount: '11.00'
                      payerTripMemberId: '201'
                      settlementId: null
                      isEditLocked: true
                    - expenseId: '501'
                      name: 식사
                      paidDate: '2026-11-05'
                      currency: KRW
                      amount: '12000.00'
                      payerTripMemberId: '201'
                      settlementId: null
                      isEditLocked: false
                    page:
                      page: 0
                      size: 20
                      totalElements: 2
                      hasNext: false
                emptyResult:
                  summary: 조건에 맞는 지출이 없음
                  value:
                    data: []
                    page:
                      page: 0
                      size: 20
                      totalElements: 0
                      hasNext: false
        '400':
          description: |
            page가 0보다 작거나, size가 1~100을 벗어나거나, fromDate나 toDate가 YYYY-MM-DD 형식의 날짜가 아니거나, fromDate가 toDate보다 뒤입니다.

            **오류 코드:** `COMMON_INVALID_REQUEST`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_INVALID_REQUEST:
                  summary: fromDate가 toDate보다 뒤임
                  value:
                    code: COMMON_INVALID_REQUEST
                    message: 요청이 올바르지 않습니다.
                    errors: null
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          description: |
            요청한 회원이 이 여행에 참여하지 않았거나 여행을 나갔습니다.

            **오류 코드:** `COMMON_FORBIDDEN`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_FORBIDDEN:
                  summary: 참여 중인 여행이 아님
                  value:
                    code: COMMON_FORBIDDEN
                    message: 요청을 수행할 권한이 없습니다.
                    errors: null
        '404':
          description: |
            tripId에 해당하는 여행이 없거나 삭제됐습니다.

            **오류 코드:** `COMMON_NOT_FOUND`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_NOT_FOUND:
                  summary: 여행이 없거나 삭제됨
                  value:
                    code: COMMON_NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다.
                    errors: null
    post:
      tags:
      - Expense
      operationId: createExpense
      summary: 지출 생성
      description: |
        결제 정보와 부담자를 입력한 지출을 저장하고, 서버가 계산한 참여자별 최종 부담액과 원화 환산액을 함께 저장합니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자만 요청할 수 있습니다. 요청한 회원이 지출의 기록자(createdByTripMemberId)가 됩니다.

        ### 처리 조건
        확정된 여행에서만 등록할 수 있습니다. 결제자는 이 여행에 참여 중인 로그인 참여자여야 하고, 부담자는 참여 중인 로그인 참여자나 비로그인 참여자여야 합니다.
        최종 결제액(amount)은 전체 1/N이면 originalAmount - discountAmount, 품목별이면 originalAmount - 상품 할인 합계 - discountAmount이며 0 이상이어야 합니다. 품목별이면 상품 할인 전 품목 금액의 합계가 originalAmount와 같아야 합니다.
        참여자별 부담액은 최종 결제액을 부담 비율대로 나눈 값입니다. 부담 비율은 품목마다 상품 할인 뒤 금액을 그 품목의 부담자에게 똑같이 나눈 합이고, 전체 1/N이면 모두 같습니다. 전체 할인도 이 비율로 나뉩니다.
        부담액은 통화의 최소 단위(KRW, JPY는 1, USD, EUR, CNY는 0.01)로 내린 뒤, 남은 단위를 소수점 이하가 큰 참여자부터, 같으면 여행 참여자 ID가 작은 참여자부터 하나씩 배정합니다.
        원화 환산액(amountKrw)은 최종 결제액에 환율을 곱해 1원 단위로 반올림(HALF_UP)합니다. 참여자별 원화 부담액은 원화 환산액을 부담액 비율대로 같은 방식으로 나눠 합계를 맞춥니다.

        ### 사용 시 주의
        앱은 저장 시도마다 Idempotency-Key에 새 UUID를 보내고, 응답을 받지 못해 같은 저장을 다시 보낼 때만 같은 키를 사용합니다.
        같은 회원이 같은 여행에서 같은 키로 다시 보내면 새 지출을 만들지 않고 처음 만든 지출의 현재 상세를 처음과 같이 201로 반환합니다. 요청 본문은 처음 요청과 비교하지 않습니다.
        같은 키의 요청이 동시에 와도 지출은 하나만 저장하고, 모든 요청이 그 지출을 받습니다.
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 지출 생성 요청의 고유키입니다. 앱이 저장 시도마다 UUID로 만들고, 같은 저장을 다시 보낼 때만 같은 값을 사용합니다. 키는 지출 생성에만 쓰며 지출 생성 키끼리 한 번만 사용할 수 있습니다. 만료되지 않고 만든 지출과 함께 보관합니다. 하이픈으로 구분한 8-4-4-4-12자리 16진수 표기만 받습니다.
        schema:
          type: string
          format: uuid
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          example: 8b2e4c1a-3f5d-4a6b-9c7e-1d2f3a4b5c6d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "./expense.yml#/components/schemas/ExpenseCreate"
            examples:
              equal:
                summary: 전체 1/N 지출 생성
                value:
                  name: 식사
                  splitType: EQUAL
                  currency: KRW
                  paidDate: '2026-11-05'
                  paymentMethod: CARD
                  payerTripMemberId: '201'
                  originalAmount: '12000.00'
                  discountAmount: '0.00'
                  exchangeRate: '1.00'
                  exchangeRateSource: MANUAL
                  tripMemberIds:
                  - '201'
                  - '202'
              byItem:
                summary: 품목별 지출 생성
                value:
                  name: Dinner
                  splitType: BY_ITEM
                  currency: USD
                  paidDate: '2026-11-06'
                  paymentMethod: TRAVEL_CARD
                  payerTripMemberId: '201'
                  originalAmount: '12.34'
                  discountAmount: '0.34'
                  exchangeRate: '1380.55'
                  exchangeRateSource: AUTO
                  items:
                  - name: 피자
                    amount: '10.00'
                    discountAmount: '1.00'
                    tripMemberIds:
                    - '201'
                    - '202'
                  - amount: '2.34'
                    discountAmount: '0.00'
                    tripMemberIds:
                    - '201'
      responses:
        '201':
          description: 지출 생성 성공. 같은 회원이 같은 키로 다시 요청해도 처음 만든 지출을 반환합니다.
          headers:
            Location:
              description: 생성한 지출의 URI입니다. /api/v1/trips/{tripId}/expenses/{expenseId} 형식입니다.
              schema:
                type: string
              example: /api/v1/trips/123/expenses/501
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./expense.yml#/components/schemas/ExpenseDetail"
              examples:
                equal:
                  summary: 전체 1/N 지출 생성 성공
                  value:
                    data:
                      expenseId: '501'
                      name: 식사
                      paidDate: '2026-11-05'
                      currency: KRW
                      amount: '12000.00'
                      payerTripMemberId: '201'
                      settlementId: null
                      isEditLocked: false
                      tripId: '123'
                      splitType: EQUAL
                      createdByTripMemberId: '201'
                      paymentMethod: CARD
                      originalAmount: '12000.00'
                      discountAmount: '0.00'
                      exchangeRate: '1.00'
                      exchangeRateSource: MANUAL
                      exchangeRateProvider: null
                      exchangeRateBaseDate: null
                      amountKrw: '12000.00'
                      items: []
                      shares:
                      - tripMemberId: '201'
                        amount: '6000.00'
                        amountKrw: '6000.00'
                      - tripMemberId: '202'
                        amount: '6000.00'
                        amountKrw: '6000.00'
                byItem:
                  summary: 품목별 지출 생성 성공
                  description: 최종 결제액 11.00달러를 13.68 대 9.00 비율로 나눕니다. 남은 1센트는 소수점 이하가 더 큰 202에게 배정합니다.
                  value:
                    data:
                      expenseId: '502'
                      name: Dinner
                      paidDate: '2026-11-06'
                      currency: USD
                      amount: '11.00'
                      payerTripMemberId: '201'
                      settlementId: null
                      isEditLocked: false
                      tripId: '123'
                      splitType: BY_ITEM
                      createdByTripMemberId: '201'
                      paymentMethod: TRAVEL_CARD
                      originalAmount: '12.34'
                      discountAmount: '0.34'
                      exchangeRate: '1380.55'
                      exchangeRateSource: AUTO
                      exchangeRateProvider: null
                      exchangeRateBaseDate: null
                      amountKrw: '15186.00'
                      items:
                      - expenseItemId: '701'
                        name: 피자
                        amount: '10.00'
                        discountAmount: '1.00'
                        sortOrder: 0
                        tripMemberIds:
                        - '201'
                        - '202'
                      - expenseItemId: '702'
                        name: null
                        amount: '2.34'
                        discountAmount: '0.00'
                        sortOrder: 1
                        tripMemberIds:
                        - '201'
                      shares:
                      - tripMemberId: '201'
                        amount: '6.63'
                        amountKrw: '9153.00'
                      - tripMemberId: '202'
                        amount: '4.37'
                        amountKrw: '6033.00'
        '400':
          description: |
            요청 형식이나 값이 올바르지 않거나, 부담자와 금액이 지출 등록 조건에 맞지 않습니다.

            | 오류 코드 | 발생 조건 |
            | --- | --- |
            | `COMMON_INVALID_REQUEST` | Idempotency-Key가 없거나 형식이 올바르지 않거나, 요청 본문이 필드 형식과 범위를 벗어났습니다. 분배 방식에 맞지 않는 tripMemberIds나 items, 통화의 최소 단위보다 작은 소수, KRW 지출의 1.00이 아닌 환율, 상품 할인이 품목 금액보다 큰 품목, 0 미만인 최종 결제액과 정수부가 10자리를 넘는 원화 환산액도 포함합니다. |
            | `EXPENSE_INVALID_SHARES` | 결제자가 이 여행에 참여 중인 로그인 참여자가 아니거나, 부담자가 없거나 겹치거나 이 여행에 참여 중인 로그인 참여자나 비로그인 참여자가 아닙니다. |
            | `EXPENSE_AMOUNT_MISMATCH` | 품목별 지출에서 상품 할인 전 품목 금액의 합계가 originalAmount와 다릅니다. |
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_INVALID_REQUEST:
                  summary: 고유키나 요청 본문이 올바르지 않음
                  value:
                    code: COMMON_INVALID_REQUEST
                    message: 요청이 올바르지 않습니다.
                    errors: null
                EXPENSE_INVALID_SHARES:
                  summary: 결제자나 부담자로 지정할 수 없는 참여자
                  value:
                    code: EXPENSE_INVALID_SHARES
                    message: 결제자나 부담자로 지정할 수 없는 참여자가 있습니다.
                    errors: null
                EXPENSE_AMOUNT_MISMATCH:
                  summary: 품목 금액 합계가 총액과 다름
                  value:
                    code: EXPENSE_AMOUNT_MISMATCH
                    message: 품목 금액의 합계가 결제 총액과 다릅니다.
                    errors: null
        '401':
          "$ref": "../common/components.yml#/responses/Unauthorized"
        '403':
          description: |
            요청한 회원이 이 여행에 참여하지 않았거나 여행을 나갔습니다.

            **오류 코드:** `COMMON_FORBIDDEN`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_FORBIDDEN:
                  summary: 참여 중인 여행이 아님
                  value:
                    code: COMMON_FORBIDDEN
                    message: 요청을 수행할 권한이 없습니다.
                    errors: null
        '404':
          description: |
            tripId에 해당하는 여행이 없거나 삭제됐습니다.

            **오류 코드:** `COMMON_NOT_FOUND`
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                COMMON_NOT_FOUND:
                  summary: 여행이 없거나 삭제됨
                  value:
                    code: COMMON_NOT_FOUND
                    message: 요청한 리소스를 찾을 수 없습니다.
                    errors: null
        '409':
          description: |
            지출 등록 요청이 여행이나 고유키의 현재 상태와 충돌합니다.

            | 오류 코드 | 발생 조건 |
            | --- | --- |
            | `EXPENSE_TRIP_NOT_CONFIRMED` | 확정 전 여행입니다. |
            | `EXPENSE_IDEMPOTENCY_KEY_REUSED` | 다른 회원이나 다른 여행에서 이미 사용한 Idempotency-Key이거나, 그 키로 만든 지출이 삭제됐습니다. 기존 지출 정보는 반환하지 않습니다. |
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              examples:
                EXPENSE_TRIP_NOT_CONFIRMED:
                  summary: 여행이 확정 전임
                  value:
                    code: EXPENSE_TRIP_NOT_CONFIRMED
                    message: 여행을 확정한 뒤에 지출을 등록할 수 있습니다.
                    errors: null
                EXPENSE_IDEMPOTENCY_KEY_REUSED:
                  summary: 다른 요청에서 사용했거나 삭제된 지출의 고유키
                  value:
                    code: EXPENSE_IDEMPOTENCY_KEY_REUSED
                    message: 이미 사용된 지출 등록 요청입니다. 다시 시도해주세요.
                    errors: null
  "/api/v1/trips/{tripId}/expenses/{expenseId}":
    parameters:
    - "$ref": "./trip.yml#/components/parameters/TripId"
    - "$ref": "./expense.yml#/components/parameters/ExpenseId"
    get:
      tags:
      - Expense
      operationId: getExpense
      summary: 지출 상세 조회
      description: |
        지출의 결제 정보, 품목, 참여자별 최종 부담액과 저장한 환율을 조회합니다.

        ### 요청 권한
        이 여행에 참여 중인 로그인 참여자만 요청할 수 있습니다.

        ### 처리 조건
        정산에 포함된 지출도 조회할 수 있습니다. 다른 회원이 수정 중이어도 마지막으로 저장한 값을 반환합니다.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 지출 상세 조회 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                additionalProperties: false
                properties:
                  data:
                    "$ref": "./expense.yml#/components/schemas/ExpenseDetail"
              examples:
                success:
                  summary: 전체 1/N 지출 상세 조회 성공
                  value:
                    data:
                      expenseId: '501'
                      name: 식사
                      paidDate: '2026-11-05'
                      currency: KRW
                      amount: '12000.00'
                      payerTripMemberId: '201'
                      settlementId: null

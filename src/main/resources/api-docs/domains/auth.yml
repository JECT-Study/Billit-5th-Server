paths:
  /api/v1/auth/social-logins:
    post:
      tags:
      - Auth
      summary: AUTH-01 소셜 로그인
      operationId: socialLogin
      description: |-
        소셜 계정으로 로그인하거나 가입 절차를 시작합니다.

        Apple 로그인 응답을 받지 못하면 소셜 인증을 다시 진행해 새 인가 코드를 받습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SocialIdTokenRequest'
                - $ref: '#/components/schemas/AppleSocialLoginRequest'
      responses:
        '200':
          description: 소셜 인증 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/AuthenticatedSocialLogin'
                      - $ref: '#/components/schemas/RegistrationRequiredSocialLogin'
        '400':
          $ref: '../common/components.yml#/responses/BadRequest'
        '401':
          description: |-
            - `AUTH_SOCIAL_AUTHENTICATION_FAILED`: ID 토큰 또는 Apple 인가 코드 검증 실패
          content:
            application/json:
              schema:
                $ref: '../common/components.yml#/schemas/ErrorResponse'
              example:
                code: AUTH_SOCIAL_AUTHENTICATION_FAILED
                message: 소셜 인증에 실패했습니다.
                errors: null
        '503':
          description: |-
            - `AUTH_SOCIAL_PROVIDER_UNAVAILABLE`: 제공자 장애나 타임아웃으로 로그인 처리 불가
          content:
            application/json:
              schema:
                $ref: '../common/components.yml#/schemas/ErrorResponse'
              example:
                code: AUTH_SOCIAL_PROVIDER_UNAVAILABLE
                message: 소셜 로그인 제공자에 연결할 수 없습니다.
                errors: null
  "/api/v1/auth/token-refreshes":
    post:
      tags:
      - Auth
      summary: AUTH-02 Access Token 갱신
      operationId: refreshTokens
      description: |-
        현재 세션의 Access Token과 Refresh Token을 갱신합니다.

        갱신에 성공하면 기존 Refresh Token을 폐기합니다. 새 Access Token은 15분, 새 Refresh Token은 30일간 유효합니다.
        폐기된 Refresh Token을 다시 제출하면 해당 세션의 두 토큰을 즉시 차단하고 401을 반환합니다. 다른 세션은 유지합니다.
        네트워크 오류로 응답을 받지 못하면 기존 Refresh Token으로 한 번만 재시도합니다. 401을 받으면 다시 로그인합니다.
      responses:
        '200':
          description: 토큰 갱신 성공.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/TokenRefreshResult"
                additionalProperties: false
              example:
                data:
                  accessToken: example-access-token
                  refreshToken: example-refresh-token
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          description: |-
            - `AUTH_REFRESH_TOKEN_INVALID`: 제출한 Refresh Token이 만료됐거나 유효하지 않음. 이미 갱신에 사용한 토큰도 포함
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              example:
                code: AUTH_REFRESH_TOKEN_INVALID
                message: Refresh Token이 유효하지 않습니다.
                errors: null
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
                  description: Billit 서버가 해당 기기의 로그인 유지에 사용하도록 발급한 Refresh Token.
                    빈 문자열과 null은 허용하지 않음
              additionalProperties: false
              required:
              - refreshToken
            example:
              refreshToken: example-refresh-token
  "/api/v1/auth/logout":
    post:
      tags:
      - Auth
      summary: AUTH-03 현재 기기 로그아웃
      operationId: logout
      description: |-
        현재 로그인 세션을 종료합니다.

        유효한 Access Token이 있으면 Authorization 헤더에 보내고 본문을 생략합니다. Access Token이 만료됐다면 헤더를 생략하고 본문에 Refresh Token을 보냅니다.
        로그아웃이 완료되면 해당 세션의 두 토큰을 즉시 차단합니다. 다른 세션은 유지합니다.
      responses:
        '204':
          "$ref": "../common/components.yml#/responses/NoContent"
        '400':
          "$ref": "../common/components.yml#/responses/BadRequest"
        '401':
          description: |-
            - `COMMON_UNAUTHORIZED`: 세션을 확인할 유효한 토큰이 없거나 해당 세션이 이미 종료됨
          content:
            application/json:
              schema:
                "$ref": "../common/components.yml#/schemas/ErrorResponse"
              example:
                code: COMMON_UNAUTHORIZED
                message: 인증이 필요합니다.
                errors: null
      security:
      - bearerAuth: []
      - {}
      requestBody:
        description: Access Token이 만료됐을 때 유효한 Refresh Token을 전달합니다.
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              additionalProperties: false
              properties:
                refreshToken:
                  type: string
                  minLength: 1
components:
  schemas:
    SocialIdTokenRequest:
      type: object
      additionalProperties: false
      required: [provider, idToken]
      properties:
        provider:
          type: string
          enum: [GOOGLE, KAKAO]
        idToken:
          type: string
          pattern: '\S'
          description: 모바일 SDK에서 받은 ID 토큰
    AppleSocialLoginRequest:
      type: object
      additionalProperties: false
      required: [provider, idToken, authorizationCode]
      properties:
        provider:
          type: string
          enum: [APPLE]
        idToken:
          type: string
          pattern: '\S'
          description: 모바일 SDK에서 받은 ID 토큰
        authorizationCode:
          type: string
          pattern: '\S'
          description: 로그인 시 교환하는 Apple 인가 코드
        fullName:
          type: string
          pattern: '\S'
          description: 최초 권한 부여 시 Apple SDK가 반환한 표시 이름
    AuthenticatedSocialLogin:
      type: object
      additionalProperties: false
      required: [status, accessToken, refreshToken]
      properties:
        status:
          type: string
          enum: [AUTHENTICATED]
        accessToken:
          type: string
          description: 빌릿 회원용 Access Token
        refreshToken:
          type: string
          description: 빌릿 회원용 Refresh Token
    RegistrationRequiredSocialLogin:
      type: object
      additionalProperties: false
      required: [status, registrationToken]
      properties:
        status:
          type: string
          enum: [REGISTRATION_REQUIRED]
        registrationToken:
          type: string
          description: 빌릿 가입 전용 토큰
    TokenRefreshResult:
      type: object
      required:
      - accessToken
      - refreshToken
      properties:
        accessToken:
          type: string
          minLength: 1
          description: 새로 발급한 회원용 Access Token.
        refreshToken:
          type: string
          minLength: 1
          description: 다음 토큰 갱신에 사용할 Refresh Token.
      additionalProperties: false

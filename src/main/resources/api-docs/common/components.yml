securitySchemes:
  registrationBearerAuth:
    type: http
    description: 발급 시점부터 30분간 유효한 가입 전용 토큰입니다. 가입 완료 후에는 같은 가입 완료 요청의 복구에만 사용할 수 있습니다.
    scheme: bearer
  bearerAuth:
    type: http
    scheme: bearer
schemas:
  ApiResponse:
    type: object
    required:
    - data
    additionalProperties: false
    properties:
      data:
        nullable: true
        description: API별 응답 데이터. 구체적인 타입과 null 허용 여부는 API별로 정의합니다.
  PageResponse:
    type: object
    required:
    - data
    - page
    additionalProperties: false
    properties:
      data:
        type: array
        items: {}
      page:
        $ref: './components.yml#/schemas/PageInfo'
  PageInfo:
    type: object
    required:
    - page
    - size
    - totalElements
    - hasNext
    additionalProperties: false
    properties:
      page:
        type: integer
        minimum: 0
        example: 0
      size:
        type: integer
        minimum: 1
        maximum: 100
        example: 20
      totalElements:
        type: integer
        format: int64
        minimum: 0
        example: 57
      hasNext:
        type: boolean
        example: true
  ErrorResponse:
    type: object
    required:
    - code
    - message
    - errors
    additionalProperties: false
    properties:
      code:
        type: string
        pattern: ^[A-Z][A-Z0-9]*(_[A-Z0-9]+)+$
        example: COMMON_INVALID_REQUEST
      message:
        type: string
        description: 사용자 표시용 메시지. 오류 코드와 함께 서버에서 관리합니다.
        example: 요청이 올바르지 않습니다.
      errors:
        type: array
        nullable: true
        minItems: 1
        items:
          $ref: './components.yml#/schemas/FieldError'
        description: 필드 이름순으로 정렬합니다. 필드 오류가 없거나 특정할 수 없으면 null입니다.
  FieldError:
    type: object
    required:
    - field
    - reason
    additionalProperties: false
    properties:
      field:
        type: string
        example: amount
      reason:
        type: string
        example: 0보다 커야 합니다.
  ResourceId:
    type: string
    description: DB 타입과 관계없이 문자열로 전달합니다.
    example: '123'
  DecimalString:
    type: string
    pattern: ^-?(0|[1-9][0-9]*)\.[0-9]{2}$
    description: 금액과 환율의 소수점 이하 2자리 문자열. 요청 DTO는 형식을 검증하고, 계산과 반올림은 업무 코드에서 처리합니다.
    example: '3500.00'
parameters:
  Page:
    name: page
    in: query
    schema:
      type: integer
      minimum: 0
      default: 0
  Size:
    name: size
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  Sort:
    name: sort
    in: query
    description: 필드,방향 형식. 허용 필드와 기본 정렬은 API별로 명시하며, 동률이면 ID로 정렬합니다.
    schema:
      type: string
      pattern: ^[^,]+,(asc|desc)$
      example: paidAt,desc
responses:
  NoContent:
    description: 처리 성공, 응답 본문 없음
  BadRequest:
    description: |
      요청 형식이나 필드가 올바르지 않습니다.

      **오류 코드:** `COMMON_INVALID_REQUEST`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_INVALID_REQUEST:
            summary: 요청 형식이나 필드가 올바르지 않습니다.
            value:
              code: COMMON_INVALID_REQUEST
              message: 요청이 올바르지 않습니다.
              errors: null
  Unauthorized:
    description: |
      인증 정보가 누락됐거나 만료 또는 유효하지 않습니다.

      **오류 코드:** `COMMON_UNAUTHORIZED`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_UNAUTHORIZED:
            summary: 인증 정보가 누락됐거나 만료 또는 유효하지 않습니다.
            value:
              code: COMMON_UNAUTHORIZED
              message: 인증이 필요합니다.
              errors: null
  Forbidden:
    description: |
      요청을 수행할 접근 또는 변경 권한이 없습니다.

      **오류 코드:** `COMMON_FORBIDDEN`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_FORBIDDEN:
            summary: 요청을 수행할 접근 또는 변경 권한이 없습니다.
            value:
              code: COMMON_FORBIDDEN
              message: 요청을 수행할 권한이 없습니다.
              errors: null
  NotFound:
    description: |
      요청한 리소스가 존재하지 않습니다.

      **오류 코드:** `COMMON_NOT_FOUND`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_NOT_FOUND:
            summary: 요청한 리소스가 존재하지 않습니다.
            value:
              code: COMMON_NOT_FOUND
              message: 요청한 리소스를 찾을 수 없습니다.
              errors: null
  MethodNotAllowed:
    description: |
      해당 경로에서 요청한 HTTP 메서드를 지원하지 않습니다.

      **오류 코드:** `COMMON_METHOD_NOT_ALLOWED`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_METHOD_NOT_ALLOWED:
            summary: 해당 경로에서 요청한 HTTP 메서드를 지원하지 않습니다.
            value:
              code: COMMON_METHOD_NOT_ALLOWED
              message: 지원하지 않는 HTTP 메서드입니다.
              errors: null
  NotAcceptable:
    description: |
      요청한 응답 형식을 지원하지 않습니다.

      **오류 코드:** `COMMON_NOT_ACCEPTABLE`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_NOT_ACCEPTABLE:
            summary: 요청한 응답 형식을 지원하지 않습니다.
            value:
              code: COMMON_NOT_ACCEPTABLE
              message: 지원하지 않는 응답 형식입니다.
              errors: null
  Conflict:
    description: |
      현재 업무 상태와 요청이 충돌합니다.

      **오류 코드:** `COMMON_CONFLICT`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_CONFLICT:
            summary: 현재 업무 상태와 요청이 충돌합니다.
            value:
              code: COMMON_CONFLICT
              message: 현재 상태에서는 요청을 처리할 수 없습니다.
              errors: null
  PayloadTooLarge:
    description: |
      요청 본문이 업로드 가능한 크기를 초과했습니다.

      **오류 코드:** `COMMON_PAYLOAD_TOO_LARGE`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_PAYLOAD_TOO_LARGE:
            summary: 요청 본문이 업로드 가능한 크기를 초과했습니다.
            value:
              code: COMMON_PAYLOAD_TOO_LARGE
              message: 업로드 가능한 크기를 초과했습니다.
              errors: null
  UnsupportedMediaType:
    description: |
      요청 본문의 미디어 타입을 지원하지 않습니다.

      **오류 코드:** `COMMON_UNSUPPORTED_MEDIA_TYPE`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_UNSUPPORTED_MEDIA_TYPE:
            summary: 요청 본문의 미디어 타입을 지원하지 않습니다.
            value:
              code: COMMON_UNSUPPORTED_MEDIA_TYPE
              message: 지원하지 않는 미디어 타입입니다.
              errors: null
  InternalServerError:
    description: |
      예상하지 못한 서버 오류로 요청을 처리할 수 없습니다.

      **오류 코드:** `COMMON_INTERNAL_SERVER_ERROR`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_INTERNAL_SERVER_ERROR:
            summary: 예상하지 못한 서버 오류로 요청을 처리할 수 없습니다.
            value:
              code: COMMON_INTERNAL_SERVER_ERROR
              message: 서버 오류가 발생했습니다.
              errors: null
  ServiceUnavailable:
    description: |
      일시적인 서비스 장애로 요청을 처리할 수 없습니다.

      **오류 코드:** `COMMON_SERVICE_UNAVAILABLE`
    content:
      application/json:
        schema:
          $ref: './components.yml#/schemas/ErrorResponse'
        examples:
          COMMON_SERVICE_UNAVAILABLE:
            summary: 일시적인 서비스 장애로 요청을 처리할 수 없습니다.
            value:
              code: COMMON_SERVICE_UNAVAILABLE
              message: 일시적으로 요청을 처리할 수 없습니다.
              errors: null

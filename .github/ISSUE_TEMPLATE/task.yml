name: 일반 작업
description: 기능, 개선, 문서, 설정과 리팩터링 작업을 등록합니다.
body:
  - type: textarea
    id: background
    attributes:
      label: 작업 배경
      description: 어떤 문제나 필요 때문에 작업하는지 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 이슈에서 다룰 범위를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 무엇을 확인하면 작업이 끝났다고 판단할 수 있는지 작성합니다. 배포 후 검증이 필요하면 포함합니다.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 상세 내용
      description: 세부 작업이나 구현 방향을 작성합니다. 미리 확정하지 않아도 됩니다.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 참고 사항
      description: 관련 이슈, 기획, 디자인과 검토에 필요한 맥락을 작성합니다.
    validations:
      required: false

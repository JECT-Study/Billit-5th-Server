name: discord-pr

on:
  pull_request:
    types: [opened, ready_for_review]

permissions: {}

jobs:
  notify:
    name: notify discord
    # draft PR은 opened 때 건너뛰고, ready_for_review 때 알림
    if: github.event.action == 'ready_for_review' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send Discord Embed
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_AVATAR: ${{ github.event.pull_request.user.avatar_url }}
          PR_AUTHOR_URL: ${{ github.event.pull_request.user.html_url }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret이 없어 알림을 건너뜁니다."
            exit 0
          fi

          payload=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            --arg author_avatar "$PR_AUTHOR_AVATAR" \
            --arg author_url "$PR_AUTHOR_URL" \
            --arg base "$BASE_BRANCH" \
            --arg head "$HEAD_BRANCH" \
            --arg additions "$ADDITIONS" \
            --arg deletions "$DELETIONS" \
            --arg files "$CHANGED_FILES" \
            --arg timestamp "$CREATED_AT" \
            '{
              username: "[BE] PR 알림",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                {
                  title: $title,
                  url: $url,
                  color: 2328118,
                  author: {
                    name: $author,
                    icon_url: $author_avatar,
                    url: $author_url
                  },
                  description: "🚀 **새로운 Pull Request가 등록되었습니다.** 확인 후 리뷰 부탁드립니다!",
                  fields: [
                    {
                      name: "📌 브랜치",
                      value: "`\($base)` ⬅️ `\($head)`",
                      inline: true
                    },
                    {
                      name: "📊 코드 변경",
                      value: "`+\($additions)` / `-\($deletions)` (\($files) files)",
                      inline: true
                    }
                  ],
                  footer: {
                    text: "Billit-5th-Server • JECT 5기 3팀",
                    icon_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                  },
                  timestamp: $timestamp
                }
              ]
            }')

          curl -sS --fail-with-body -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK_URL"

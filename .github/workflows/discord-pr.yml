name: discord-pr

on:
  pull_request:
    types: [opened, ready_for_review]

permissions: {}

jobs:
  notify:
    name: notify discord
    # draft PR은 opened 때 건너뛰고, ready_for_review 때 알림
    if: github.event.action == 'ready_for_review' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret이 없어 알림을 건너뜁니다."
            exit 0
          fi

          # FE와 일관된 포맷 유지 + 가독성을 높인 인용 블록/브랜치/변경량 추가
          payload=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg url "$PR_URL" \
            --arg base "$BASE_BRANCH" \
            --arg head "$HEAD_BRANCH" \
            --arg additions "$ADDITIONS" \
            --arg deletions "$DELETIONS" \
            '($title | sub("^[A-Za-z]+(\\([^)]*\\))?!?:\\s*"; "") | gsub("^\\s+|\\s+$"; "")) as $summary
            | {
                username: "[BE] PR",
                avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                content: "🔔 **\($summary)** 완료되어 PR 요청드립니다!\n\n> 🌿 `\($base)` ⬅️ `\($head)`\n> 👤 **작성자**: `\($author)`  |  📊 **변경**: `+\($additions) / -\($deletions)`\n\n\($url)",
                allowed_mentions: {parse: []}
              }')

          curl -sS --fail-with-body -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK_URL"
